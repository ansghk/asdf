  }, immediate ? 0 : 650);
}

function selectMeetingDept(i){
  meetingState.deptIndex = i;
  saveMeetingState();
  renderMeetingMode();
}

/* 회의록 자동 조합 함수 */
function generateMeetingText(){
  const formatListByDept = (items) => {
    if(!items || items.length === 0) return '없음';
    let res = [];
    DEPTS.forEach(d => {
      const dItems = items.filter(x => x.dept === d);
      if(dItems.length > 0){
        res.push(`[${d}]`);
        dItems.forEach((x, i) => res.push(`  ${i+1}. ${x.text}`));
      }
    });
    return res.length > 0 ? res.join('\n') : '없음';
  };

  return `[문화부 주간 피드백 전체 회의록]
일시: ${new Date().toLocaleString('ko-KR')}

■ 1. 회의 총평 및 특이사항 메모 (문화부 전체)
${meetingState.notes || '없음'}

■ 2. 차주에 할 일 (과별 계획)
${formatListByDept(meetingState.next)}

■ 3. 과별 피드백 및 지시사항
${formatListByDept(meetingState.decisions)}`;
}

/* 회의모드 렌더링 */
function renderMeetingMode(){
  const el = document.getElementById('meetingMode');
  if(!el) return;

  const currentDept = DEPTS[meetingState.deptIndex] || DEPTS[0];
  const cKey = DEPT_COLOR_KEY[currentDept];

  const goals = goalsFor(currentDept);
  const totalGoals = goals.length;
  const completedGoals = goals.filter(g => Number(g.current) >= Number(g.target)).length;
  const goalProgressPct = totalGoals > 0 ? Math.round((completedGoals / totalGoals) * 100) : 0;

  let currentDeptItems = [];
  if(state.data && state.data.departments && state.data.departments[currentDept]){
    const weeklyData = state.data.departments[currentDept].weekly || {};
    Object.keys(weeklyData).forEach(cat => {
      const catBucket = weeklyData[cat];
      if(catBucket && catBucket.items){
        catBucket.items.forEach(it => {
          currentDeptItems.push({ ...it, category: cat });
        });
      }
    });
  }

  const currentNextList = (meetingState.next || []).filter(x => x.dept === currentDept);
  const currentFeedbackList = (meetingState.decisions || []).filter(x => x.dept === currentDept);

  const deptTabsHtml = DEPTS.map((d, i) => {
    const isActive = i === meetingState.deptIndex;
    const keyColor = DEPT_COLOR_KEY[d];
    return `
      <div class="pf-dept-tab ${isActive ? 'active' : ''}" 
           style="--dept-color: var(--dept-${keyColor})" 
           onclick="selectMeetingDept(${i})">
        ${d}
      </div>`;
  }).join('');

  const doneListHtml = currentDeptItems.length > 0 
    ? currentDeptItems.map(it => `
        <div class="pf-item-box">
          <div class="pf-item-tag">${escapeHtml(it.category || '기타업무')}</div>
          <div class="pf-item-title">${escapeHtml(it.title || '(제목 없음)')}</div>
          <div class="pf-item-desc">${escapeHtml(it.content || '내용 없음')}</div>
        </div>
      `).join('')
    : `<div class="empty-cat">이번 주 보고된 업무가 없습니다.</div>`;

  const nextListHtml = currentNextList.length > 0
    ? currentNextList.map((it, idx) => `
        <div class="pf-row-item">
          <span>🚀 ${escapeHtml(it.text)}</span>
          <button class="pf-del-btn" onclick="removeFeedbackItem('next', '${escapeHtml(it.text)}')">✕</button>
        </div>
      `).join('')
    : `<div class="empty-cat">차주 예정 과제를 입력하세요.</div>`;

  const feedbackListHtml = currentFeedbackList.length > 0
    ? currentFeedbackList.map((it, idx) => `
        <div class="pf-row-item">
          <span>💡 ${escapeHtml(it.text)}</span>
          <button class="pf-del-btn" onclick="removeFeedbackItem('decisions', '${escapeHtml(it.text)}')">✕</button>
        </div>
      `).join('')
    : `<div class="empty-cat">회의 피드백 지시사항을 입력하세요.</div>`;

  el.innerHTML = `
    <div class="pf-hero">
      <div class="pf-title-area">
        <h1 class="pf-title">👥 주간 피드백 회의모드</h1>
        <p class="pf-sub">과별 한일/할일을 점검하고, 피드백 지시사항을 기록하여 전달합니다.</p>
      </div>
      <div class="pf-actions">
        <button class="pf-btn" onclick="copyMeetingMinutes()">📋 회의록 복사</button>
        <button class="pf-btn primary" onclick="saveMeetingNow()">💾 저장 및 회의록 생성</button>
      </div>
    </div>

    <div class="pf-dept-tabs">
      ${deptTabsHtml}
    </div>

    <div class="pf-grid">
      <div style="display:flex; flex-direction:column; gap:16px;">
        <div class="pf-summary-card" style="--dept-color: var(--dept-${cKey})">
          <div class="pf-summary-head">
            <h3 class="pf-summary-title">🎯 ${currentDept} · 월간 마일스톤</h3>
            <div class="pf-summary-stats mono">
              <span>목표 <b>${String(totalGoals).padStart(2,'0')}</b>건</span>
              <span style="color:var(--text-dim)">/</span>
              <span>완료 <b>${String(completedGoals).padStart(2,'0')}</b>건</span>
              <span style="color:var(--dept-color); margin-left:4px;">(${goalProgressPct}%)</span>
            </div>
          </div>
          <div class="pf-summary-bar-bg">
            <div class="pf-summary-bar-fill" style="width: ${goalProgressPct}%"></div>
          </div>
        </div>

        <div class="pf-card">
          <div class="pf-card-head">
            <h3 class="pf-card-title">📗 한 주간 한 일 <small>(일일보고 집계)</small></h3>
            <span class="pf-card-count mono">${currentDeptItems.length}건</span>
          </div>
          <div class="pf-list">
            ${doneListHtml}
          </div>
        </div>
      </div>

      <div class="pf-card">
        <div class="pf-card-head">
          <h3 class="pf-card-title">🚀 차주중점업무 <small>(차주할일)</small></h3>
          <span class="pf-card-count mono">${currentNextList.length}건</span>
        </div>
        <p class="pf-desc">차주 예정 중점 과제를 입력하세요. (매주 월요일 00:00시 자동 초기화)</p>
        <div class="pf-list">
          ${nextListHtml}
        </div>
        <div class="pf-input-group">
          <input class="pf-input" id="inputNext" placeholder="차주 예정 업무 입력" onkeydown="if(event.key==='Enter') addFeedbackItem('next')">
          <button class="pf-input-btn" onclick="addFeedbackItem('next')">+</button>
        </div>
      </div>

      <div class="pf-card highlight">
        <div class="pf-card-head">
          <h3 class="pf-card-title">💡 지시사항 & 피드백</h3>
          <span class="pf-card-count mono">${currentFeedbackList.length}건</span>
        </div>
        <p class="pf-desc">작성 후 저장 시 기본모드 과별 수신함에 전달됩니다. (매주 월요일 00:00시 자동 초기화)</p>
        <div class="pf-list">
          ${feedbackListHtml}
        </div>
        <div class="pf-input-group">
          <input class="pf-input" id="inputDecisions" placeholder="피드백 / 지시사항 입력" onkeydown="if(event.key==='Enter') addFeedbackItem('decisions')">
          <button class="pf-input-btn orange" onclick="addFeedbackItem('decisions')">+</button>
        </div>
      </div>

      <div class="pf-memo-card">
        <h3 class="pf-card-title" style="margin-bottom: 2px;">📝 회의 총평 및 특이사항 메모 (문화부 전체 공통)</h3>
        <p class="pf-desc">어떤 과를 선택하든 동일하게 유지되며, '지난 회의록' 보관함 본문에 함께 기록됩니다.</p>
        <textarea class="pf-textarea" placeholder="회의 진행 중 전체 전달사항이나 총평 메모를 자유롭게 입력하세요." oninput="meetingState.notes=this.value; saveMeetingState(false);">${escapeHtml(meetingState.notes || '')}</textarea>
      </div>
    </div>
  `;
}

function addFeedbackItem(type){
  const inputEl = document.getElementById(type === 'next' ? 'inputNext' : 'inputDecisions');
  const val = inputEl ? inputEl.value.trim() : '';
  if(!val) return;

  const currentDept = DEPTS[meetingState.deptIndex] || DEPTS[0];
  if(!meetingState[type]) meetingState[type] = [];

  meetingState[type].push({
    text: val,
    done: false,
    dept: currentDept
  });

  inputEl.value = '';
  saveMeetingState();
  renderMeetingMode();
}

function removeFeedbackItem(type, text){
  const currentDept = DEPTS[meetingState.deptIndex] || DEPTS[0];
  if(!meetingState[type]) return;

  meetingState[type] = meetingState[type].filter(x => !(x.dept === currentDept && x.text === text));
  saveMeetingState();
  renderMeetingMode();
}

async function copyMeetingMinutes(){
  try{
    await navigator.clipboard.writeText(generateMeetingText());
    showMeetingToast('전체 회의록을 복사했습니다.');
  }catch(e){
    showMeetingToast('복사 권한을 확인해주세요.');
  }
}

async function saveMeetingNow(){
  saveMeetingState(true);
}

function showMeetingToast(t){
  const e=document.getElementById('meetingToast');
  if(!e) return;
  e.textContent=t;
  e.style.display='block';
  setTimeout(()=>e.style.display='none',2200);
}

function setDashboardMode(mode){
  document.body.classList.remove('meeting-active','prep-active');
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
  try{localStorage.setItem('dashboardViewMode',mode)}catch(e){}
  if(mode==='meeting'){
    document.body.classList.add('meeting-active');
    renderMeetingMode();
  }else if(mode==='sermon'){
    document.body.classList.add('prep-active');
    renderSermonPrep();
  }else{
    renderSharedFollowup();
  }
}

async function apiAction(action,params={}){
  const q=new URLSearchParams({action,...params});
  const r=await fetch(API_URL+'?'+q.toString(),{cache:'no-store'});
  const t=await r.text();
  try{return JSON.parse(t)}catch(e){return {ok:t==='ok',raw:t}}
}

function normalizeSharedMeeting(raw){
  const base=raw&&typeof raw==='object'?raw:{};
  const fix=arr=>(Array.isArray(arr)?arr:[])
    .map(x=>typeof x==='string'?{text:x,done:false,dept:'전체'}:{...x,text:String(x.text||''),done:!!x.done,dept:x.dept||'전체'})
    .filter(x => x.dept !== '전체' && x.text !== 'ㄴㅇㄹㄴㅇㄹ'); // '전체' 태그 및 테스트 항목 전면 배제

  return {...base,decisions:fix(base.decisions),next:fix(base.next)};
}

function getSharedMeeting(){
  const server=state.data?.sharedMeeting;
  const local=meetingState;
  const chosen=(server&&(server.decisions?.length||server.next?.length))?server:local;
  return normalizeSharedMeeting(chosen||{});
}

function getMeetingArchiveData(){
  const server=Array.isArray(state.data?.meetingArchive)?state.data.meetingArchive:[];
  let local=[];try{local=JSON.parse(localStorage.getItem('cultureMeetingArchiveV1')||'[]')}catch(e){}
  const current=getSharedMeeting();
  const currentFinished=current.status==='완료'?( [{id:current.id||current.completedAt||'current',status:'완료',startedAt:current.startedAt||'',endedAt:current.completedAt||'',seconds:current.seconds||0,decisions:current.decisions||[],next:current.next||[],minutes:current.minutes||generateMeetingText()}] ):[];
  const all=[...server,...currentFinished,...local];
  const seen=new Set();
  return all.filter(x=>{const k=String(x.id||x.endedAt||x.startedAt||x.minutes||'');if(!k||seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>new Date(b.endedAt||b.startedAt||0)-new Date(a.endedAt||a.startedAt||0));
}

function archiveWeekLabel(item){
  const d=new Date(item.endedAt||item.startedAt||Date.now());
  if(isNaN(d))return '날짜 미정';
  const sun=new Date(d);sun.setDate(d.getDate()-d.getDay());
  const sat=new Date(sun);sat.setDate(sun.getDate()+6);
  const f=x=>`${x.getMonth()+1}.${x.getDate()}`;
  return `${d.getFullYear()}년 ${f(sun)}–${f(sat)}`;
}

function renderSharedFollowup(){
  const el=document.getElementById('sharedFollowup');if(!el)return;
  const m=getSharedMeeting();
  const selected=state.dept||ALL_DEPTS;
  const matches=x=>selected===ALL_DEPTS||x.dept===selected; // '전체' 매칭 제거
  const decisions=m.decisions.filter(matches),next=m.next.filter(matches);
  const archiveCount=getMeetingArchiveData().length;
  if(!decisions.length&&!next.length&&!archiveCount){el.innerHTML='';return}
  const originalIndex=(type,item)=>m[type].findIndex(x=>x===item||[x.text,x.dept].join('|')===[item.text,item.dept].join('|'));
  const rows=(arr,type)=>arr.map(item=>{const i=originalIndex(type,item);return `<label class="shared-item ${item.done?'is-done':''}"><input type="checkbox" ${item.done?'checked':''} onchange="sharedToggle('${type}',${i},this.checked)"><span class="shared-item-body"><span class="shared-item-title"><b>${escapeHtml(item.text)}</b><span class="shared-dept-badge" style="--badge-color:var(--dept-${DEPT_COLOR_KEY[item.dept]||'culture'})">${escapeHtml(item.dept)}</span></span><div class="shared-meta">${type==='next'?'차주 중점 업무':'회의 피드백 지시사항'}${item.done?' · 완료됨':' · 진행 확인 필요'}</div></span></label>`}).join('')||'<div class="shared-empty">이 부서에 등록된 내용이 없습니다.</div>';
  const scope=selected===ALL_DEPTS?'전체 부서':selected;
  el.innerHTML=`<div class="shared-scope"><div class="shared-head-actions"><span>${escapeHtml(scope)} · 회의 후속 업무</span><button class="archive-open-btn" onclick="openMeetingArchive('${escapeHtml(scope)}')">🗂 지난 회의록 보기${archiveCount?` · ${archiveCount}회`:''}</button></div></div><div class="shared-followup"><div class="shared-card"><h3><span>🚀 차주 중점 업무</span><span class="sync-state">${next.length}건 · 공용 저장</span></h3><div class="shared-list">${rows(next,'next')}</div></div><div class="shared-card"><h3><span>💡 지시사항 & 피드백</span><span class="sync-state">${decisions.length}건 · 공용 저장</span></h3><div class="shared-list">${rows(decisions,'decisions')}</div></div></div>`
}

function sharedToggle(type,i,v){
  const shared=getSharedMeeting();
  if(shared[type]?.[i]){
    shared[type][i].done=v;
    meetingState={...meetingState,...shared};
    if(state.data)state.data.sharedMeeting={...shared};
    saveMeetingState(true);renderSharedFollowup();
  }
}

function openMeetingArchive(defaultDept){
  const host=document.getElementById('meetingArchiveHost');if(!host)return;
  const selected=(defaultDept&&defaultDept!=='전체 부서')?defaultDept:(state.dept&&state.dept!==ALL_DEPTS?state.dept:'전체 부서');
  host.innerHTML=`<div class="meeting-archive-overlay" onclick="if(event.target===this)closeMeetingArchive()"><div class="meeting-archive-modal"><div class="archive-modal-head"><h2>🗂 지난 회의록</h2><button class="archive-close" onclick="closeMeetingArchive()">✕</button></div><div class="archive-filters"><select class="archive-select" id="archiveDept" onchange="renderMeetingArchiveBody()"><option>전체 부서</option>${DEPTS.map(d=>`<option ${d===selected?'selected':''}>${d}</option>`).join('')}</select><select class="archive-select" id="archiveWeek" onchange="renderMeetingArchiveBody()"></select></div><div class="archive-body" id="archiveBody"></div></div></div>`;
  const archive=getMeetingArchiveData();
  const week=document.getElementById('archiveWeek');
  week.innerHTML=archive.map((x,i)=>`<option value="${i}">${archiveWeekLabel(x)}</option>`).join('')||'<option value="">저장된 회의 없음</option>';
  renderMeetingArchiveBody();
}

function closeMeetingArchive(){const h=document.getElementById('meetingArchiveHost');if(h)h.innerHTML=''}

function renderMeetingArchiveBody(){
  const body=document.getElementById('archiveBody'),week=document.getElementById('archiveWeek'),deptEl=document.getElementById('archiveDept');if(!body||!week||!deptEl)return;
  const archive=getMeetingArchiveData();const item=archive[Number(week.value)||0];
  if(!item){body.innerHTML='<div class="archive-empty">저장된 지난 회의록이 없습니다.</div>';return}
  const dept=deptEl.value;
  const match=x=>x.dept!=='전체' && (dept==='전체 부서'||x.dept===dept);
  const list=(arr,label)=>(Array.isArray(arr)?arr:[]).filter(match).map(x=>`<div class="archive-row ${x.done?'done':''}"><span class="archive-status">${x.done?'✅':'▫️'}</span><span class="archive-row-text">${escapeHtml(x.text||'')}</span><span class="shared-dept-badge" style="--badge-color:var(--dept-${DEPT_COLOR_KEY[x.dept]||'culture'})">${escapeHtml(x.dept||'전체')}</span></div>`).join('')||`<div class="archive-empty">${label}이 없습니다.</div>`;
  const dt=new Date(item.endedAt||item.startedAt||Date.now());
  body.innerHTML=`<div class="archive-summary"><b>${escapeHtml(archiveWeekLabel(item))}</b><span>${isNaN(dt)?'':dt.toLocaleString('ko-KR')}</span></div><div class="archive-section"><h3>🚀 차주 할 일</h3>${list(item.next,'차주 할 일')}</div><div class="archive-section"><h3>💡 지시사항 및 피드백</h3>${list(item.decisions,'지시사항 및 피드백')}</div><div class="archive-section"><h3>📝 전체 회의록</h3><div class="archive-minutes">${escapeHtml(item.minutes||'회의록 본문이 없습니다.')}</div></div>`;
}

function initModeSwitch(){
  loadMeetingState();
  loadSermonState();
  const saved=localStorage.getItem('dashboardViewMode')||'normal';
  document.querySelectorAll('.mode-btn').forEach(b=>b.onclick=()=>setDashboardMode(b.dataset.mode));
  setDashboardMode(saved);
}

document.addEventListener('DOMContentLoaded',initModeSwitch);

load();
setInterval(load, 60000);
</script>
</body>
</html>
