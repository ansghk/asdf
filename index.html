let msBusy = false;

function goalsFor(dept){
  const g = state.data && state.data.goals;
  return (g && g[dept]) ? g[dept] : [];
}

async function msRequest(params){
  const qs = Object.entries(params).map(([k,v]) => k + '=' + encodeURIComponent(v)).join('&');
  const res = await fetch(API_URL + '?' + qs, { cache:'no-store' });
  const text = await res.text();
  if(!res.ok) throw new Error('HTTP ' + res.status + ' · ' + text.slice(0,120));
  let data;
  try{ data = JSON.parse(text); }
  catch(e){ throw new Error('서버가 JSON을 반환하지 않음 · ' + text.slice(0,120)); }
  if(data && data.ok === false) throw new Error(data.error || '서버가 실패를 반환했습니다.');
  return data;
}

function msRefresh(){
  return fetch(API_URL, { cache:'no-store' })
    .then(r=>r.json())
    .then(d=>{ state.data = d; render(); return d; })
    .catch(()=>null);
}

async function msAddGoal(dept, title, target, unit, desc, btn){
  if(msBusy) return;
  msBusy = true;
  if(btn){ btn.disabled = true; btn.textContent = '등록 중…'; }
  try{
    await msRequest({ action:'goalAdd', dept:dept, title:title, target:target, unit:unit, desc:desc });
    const fresh = await msRefresh();
    const saved = !!(fresh && fresh.goals && (fresh.goals[dept] || []).some(g => String(g.title).trim() === title));
    if(!saved){
      alert('요청은 전송됐지만 서버에 저장되지 않았습니다.\n→ Code.gs의 goalAdd 처리부를 확인해주세요.');
    }
  }catch(e){
    alert('목표 등록 실패\n' + (e && e.message ? e.message : e));
  }finally{
    msBusy = false;
    const b = document.querySelector('[data-ms-add="' + dept + '"]');
    if(b){ b.disabled = false; b.textContent = '목표등록'; }
  }
}

async function msUpdateGoal(dept, id, delta){
  const goal = goalsFor(dept).find(g => String(g.id) === String(id));
  if(!goal) return;
  const next = Math.max(0, Number(goal.current) + delta);
  if(next === Number(goal.current)) return;
  goal.current = next;
  render();
  try{
    await msRequest({ action:'goalUpdate', id:id, delta:delta });
  }catch(e){
    goal.current = Math.max(0, next - delta);
    render();
  }
}

async function msDeleteGoal(dept, id, title){
  if(!confirm('"' + title + '" 목표를 삭제할까요?')) return;
  const list = goalsFor(dept);
  const idx = list.findIndex(g => String(g.id) === String(id));
  if(idx !== -1) list.splice(idx, 1);
  render();
  try{
    await msRequest({ action:'goalDelete', id:id });
    msRefresh();
  }catch(e){
    alert('삭제 실패했습니다.');
    msRefresh();
  }
}

const MS_ARCHIVE_KEY = 'cultureDashboard_msArchive_v1';
const MS_LAST_MONTH_KEY = 'cultureDashboard_msLastMonth_v1';

function monthKeyOf(date){
  const d = date || new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}

function msArchiveLoad(){
  try{
    const raw = localStorage.getItem(MS_ARCHIVE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}

function msArchiveSave(archive){
  try{ localStorage.setItem(MS_ARCHIVE_KEY, JSON.stringify(archive)); }catch(e){}
}

let msResetBusy = false;
let msResetDoneKey = null;

const MS_AUTO_RESET_ENABLED = false;

async function checkMonthlyMilestoneReset(){
  if(!state.data || !state.data.goals || msResetBusy) return;

  const nowKey = monthKeyOf();
  if(msResetDoneKey === nowKey) return;

  let lastKey = null;
  try{ lastKey = localStorage.getItem(MS_LAST_MONTH_KEY); }catch(e){}

  if(lastKey === null){
    try{ localStorage.setItem(MS_LAST_MONTH_KEY, nowKey); }catch(e){}
    msResetDoneKey = nowKey;
    return;
  }

  if(lastKey === nowKey){ msResetDoneKey = nowKey; return; }

  msResetBusy = true;
  try{ localStorage.setItem(MS_LAST_MONTH_KEY, nowKey); }catch(e){}
  msResetDoneKey = nowKey;
  try{
    const archive = msArchiveLoad();
    const snapshot = {};
    DEPTS.forEach(dept=>{
      const goals = goalsFor(dept);
      if(goals.length) snapshot[dept] = goals.map(g => ({ ...g }));
    });
    if(Object.keys(snapshot).length){
      const existing = archive[lastKey] || {};
      archive[lastKey] = { ...existing, ...snapshot };
      msArchiveSave(archive);
    }

    if(!MS_AUTO_RESET_ENABLED) return;

    const deleteJobs = [];
    DEPTS.forEach(dept=>{
      goalsFor(dept).forEach(g=>{
        deleteJobs.push(msRequest({ action:'goalDelete', id:g.id }).catch(()=>{}));
      });
      state.data.goals[dept] = [];
    });
    await Promise.all(deleteJobs);
  } finally {
    msResetBusy = false;
  }
}

function shiftMonthKey(monthKey, delta){
  const [y, m] = monthKey.split('-').map(Number);
  return monthKeyOf(new Date(y, (m - 1) + delta, 1));
}

const msHistoryCache = {};
const msHistoryPending = {};

function msHistoryLoad(monthKey, callback){
  if(msHistoryCache[monthKey] !== undefined){
    if(callback) callback();
    return;
  }
  if(msHistoryPending[monthKey]) return;
  msHistoryPending[monthKey] = true;
  fetch(API_URL + '?action=goalHistory&month=' + encodeURIComponent(monthKey), { cache:'no-store' })
    .then(r => r.json())
    .then(d => { msHistoryCache[monthKey] = (d && d.goals) ? d.goals : {}; })
    .catch(() => { msHistoryCache[monthKey] = null; })
    .then(() => { 
      msHistoryPending[monthKey] = false; 
      if(callback) callback(); else render();
    });
}

function msArchiveSection(dept){
  const isOpen = state.msArchiveOpen.has(dept);

  const nowKey = monthKeyOf();
  if(!state.msArchiveMonth[dept]) state.msArchiveMonth[dept] = shiftMonthKey(nowKey, -1);
  const viewKey = state.msArchiveMonth[dept];

  let goals = [];
  let loading = false;

  if(isOpen){
    const server = msHistoryCache[viewKey];
    if(server === undefined){
      msHistoryLoad(viewKey);
      loading = true;
    } else if(server === null){
      const archive = msArchiveLoad();
      goals = (archive[viewKey] && archive[viewKey][dept]) || [];
    } else {
      goals = server[dept] || [];
      if((!goals || !goals.length) && msArchiveLoad()[viewKey]?.[dept]){
        goals = msArchiveLoad()[viewKey][dept];
      }
    }
  }

  const doneCount = goals.filter(g => Number(g.current) >= Number(g.target)).length;

  const rows = loading
    ? `<div class="ms-archive-empty">시트에서 지난 마일스톤 불러오는 중…</div>`
    : (goals.length
      ? goals.map(g=>{
          const cur = Number(g.current), tgt = Math.max(1, Number(g.target));
          const done = cur >= tgt;
          const unit = escapeHtml(g.unit || '건');
          return `<div class="ms-archive-row">${done ? '✅' : '▫️'} <span class="ms-archive-row-title">${escapeHtml(g.title)}</span><span class="ms-archive-row-count mono">${cur} / ${tgt} ${unit}</span></div>`;
        }).join('')
      : `<div class="ms-archive-empty">이 달의 기록이 없습니다.</div>`);

  const [vy, vm] = viewKey.split('-');
  const canGoNext = viewKey < nowKey;

  return `
    <div class="ms-archive${isOpen ? ' open' : ''}" data-ms-archive-panel="${dept}">
      <button class="ms-archive-toggle" data-ms-archive-toggle="${dept}">
        <span class="ms-archive-chevron"></span>
        <span>지난 마일스톤 기록 보기 (${vy}.${vm})</span>
      </button>
      <div class="ms-archive-body">
        <div class="ms-archive-nav">
          <button class="ms-archive-nav-btn" data-ms-archive-prev="${dept}">‹</button>
          <span class="ms-archive-nav-label mono">${vy}.${vm}${(!loading && goals.length) ? ` · ${doneCount}/${goals.length} 달성` : ''}</span>
          <button class="ms-archive-nav-btn" data-ms-archive-next="${dept}" ${canGoNext ? '' : 'disabled'}>›</button>
        </div>
        ${rows}
      </div>
    </div>`;
}

function milestoneSection(dept){
  const goals = goalsFor(dept);
  const colorKey = DEPT_COLOR_KEY[dept];
  const doneCount = goals.filter(g => Number(g.current) >= Number(g.target)).length;

  const rows = goals.length
    ? goals.map(g => {
        const cur = Number(g.current), tgt = Math.max(1, Number(g.target));
        const pct = Math.min(100, Math.round(cur / tgt * 100));
        const done = cur >= tgt;
        const unit = escapeHtml(g.unit || '건');
        return `
        <div class="ms-row">
          <div class="ms-row-top">
            <button class="ms-del" data-ms-del="${g.id}" data-ms-title="${escapeHtml(g.title)}">🗑️</button>
            <div class="ms-info">
              <p class="ms-name">${done ? '✅ ' : ''}${escapeHtml(g.title)}</p>
              ${g.desc ? `<p class="ms-desc">${escapeHtml(g.desc)}</p>` : ''}
            </div>
            <div class="ms-counter">
              <button class="ms-btn" data-ms-minus="${g.id}" ${cur <= 0 ? 'disabled' : ''}>−</button>
              <span class="ms-count mono"><span class="cur">${cur}</span> / ${tgt} ${unit}</span>
              <button class="ms-btn" data-ms-plus="${g.id}">+</button>
            </div>
          </div>
          <div class="ms-track"><div class="ms-fill${done ? ' done' : ''}" style="width:${pct}%"></div></div>
        </div>`;
      }).join('')
    : `<div class="ms-empty">아직 등록된 목표가 없습니다.</div>`;

  const isOpen = !state.msCollapsed.has(dept);

  const totalGoals = goals.reduce((s, g) => s + Math.max(1, Number(g.target) || 0), 0);
  const completedGoals = goals.reduce((s, g) => s + Math.min(Math.max(0, Number(g.current) || 0), Math.max(1, Number(g.target) || 0)), 0);
  const goalProgressPct = totalGoals > 0 ? Math.round((completedGoals / totalGoals) * 100) : 0;
  
  const progressState = goalProgressPct === 0 ? 0 : (goalProgressPct === 100 ? 2 : 1);

  return `
    <div class="ms-panel${isOpen ? ' open' : ''}" style="--dept-color:var(--dept-${colorKey})" data-ms-panel="${dept}" data-progress="${progressState}">
      <button class="ms-head" data-ms-toggle="${dept}">
        <span class="ms-head-left">
          <span class="ms-chevron"></span>
          <span class="ms-title"><span class="ms-dot"></span><span class="ms-title-text"><span class="ms-dept">🎯 ${dept}</span><span class="ms-sub">월간 마일스톤</span></span></span>
        </span>
        <span class="ms-badge">${goals.length ? doneCount + ' / ' + goals.length + ' 달성' : '공유 목표'}</span>
      </button>
      <div class="ms-body">
      ${rows}
      <div class="ms-form">
        <input class="ms-input ms-in-title" data-ms-in="title" placeholder="목표 지표명 입력" maxlength="40">
        <div class="ms-num-group">
          <input class="ms-input ms-in-target mono" data-ms-in="target" type="number" min="1" max="999" placeholder="목표" value="4">
          <select class="ms-input ms-in-unit" data-ms-in="unit">
            <option value="건">건</option><option value="명">명</option><option value="회">회</option><option value="편">편</option><option value="%">%</option>
          </select>
        </div>
        <input class="ms-input ms-in-desc" data-ms-in="desc" placeholder="행동 지침 설명" maxlength="80">
        <button class="ms-add-btn" data-ms-add="${dept}">목표등록</button>
      </div>
      ${msArchiveSection(dept)}
      </div>
    </div>`;
}

function bindMilestoneEvents(){
  document.querySelectorAll('[data-ms-panel]').forEach(panel => {
    const dept = panel.dataset.msPanel;

    const toggle = panel.querySelector('[data-ms-toggle]');
    toggle.onclick = ()=>{
      const nowOpen = !panel.classList.contains('open');
      panel.classList.toggle('open', nowOpen);
      if(nowOpen) state.msCollapsed.delete(dept); else state.msCollapsed.add(dept);
    };

    const archivePanel = panel.querySelector('[data-ms-archive-panel]');
    if(archivePanel){
      const archiveToggle = archivePanel.querySelector('[data-ms-archive-toggle]');
      archiveToggle.onclick = ()=>{
        const nowOpen = !archivePanel.classList.contains('open');
        archivePanel.classList.toggle('open', nowOpen);
        if(nowOpen) state.msArchiveOpen.add(dept); else state.msArchiveOpen.delete(dept);
        render();
      };

      const prevBtn = archivePanel.querySelector('[data-ms-archive-prev]');
      if(prevBtn) prevBtn.onclick = ()=>{
        state.msArchiveMonth[dept] = shiftMonthKey(state.msArchiveMonth[dept] || shiftMonthKey(monthKeyOf(), -1), -1);
        state.msArchiveOpen.add(dept);
        render();
      };
      const nextBtn = archivePanel.querySelector('[data-ms-archive-next]');
      if(nextBtn) nextBtn.onclick = ()=>{
        if(nextBtn.disabled) return;
        state.msArchiveMonth[dept] = shiftMonthKey(state.msArchiveMonth[dept] || shiftMonthKey(monthKeyOf(), -1), +1);
        state.msArchiveOpen.add(dept);
        render();
      };
    }

    panel.querySelectorAll('[data-ms-plus]').forEach(b => b.onclick = ()=> msUpdateGoal(dept, b.dataset.msPlus, +1));
    panel.querySelectorAll('[data-ms-minus]').forEach(b => b.onclick = ()=> msUpdateGoal(dept, b.dataset.msMinus, -1));
    panel.querySelectorAll('[data-ms-del]').forEach(b => b.onclick = ()=> msDeleteGoal(dept, b.dataset.msDel, b.dataset.msTitle));

    const addBtn = panel.querySelector('[data-ms-add]');
    addBtn.onclick = ()=>{
      const get = k => panel.querySelector('[data-ms-in="' + k + '"]');
      const title = get('title').value.trim();
      const target = Number(get('target').value);
      const unit = get('unit').value;
      const desc = get('desc').value.trim();
      if(!title){ get('title').focus(); return; }
      if(!target || target < 1){ get('target').focus(); return; }
      msAddGoal(dept, title, target, unit, desc, addBtn);
    };
  });
}

function monthlyReportItems(){
  const itemsByDate = {};
  const deptCounts = {};
  let total = 0;
  ALL_DEPT_LIST.forEach(dept=>{
    const deptData = state.data.departments[dept];
    const bucket = (deptData && deptData.monthly) || {};
    let deptTotal = 0;
    Object.keys(bucket).forEach(category=>{
      const cat = bucket[category] || {};
      (cat.items || []).forEach(it=>{
        if(!it.date) return;
        const d = new Date(it.date);
        if(isNaN(d)) return;
        const key = dateKey(d);
        if(!itemsByDate[key]) itemsByDate[key] = [];
        itemsByDate[key].push({ ...it, dept, category });
        deptTotal++; total++;
      });
    });
    deptCounts[dept] = deptTotal;
  });
  return { itemsByDate, deptCounts, total };
}

function renderMonthlyReportSection(){
  if(!state.data) return '';
  const { itemsByDate, deptCounts, total } = monthlyReportItems();

  const now = new Date();
  const todayKey = dateKey(now);
  if(state.reportSelectedDate == null || state.reportLastTodayKey !== todayKey){
    state.reportSelectedDate = todayKey;
    state.reportLastTodayKey = todayKey;
  }

  const year = now.getFullYear(), month = now.getMonth();
  const firstDow = new Date(year, month, 1).getDay();
  const totalDays = new Date(year, month + 1, 0).getDate();

  function dayTitles(key){
    const evs = itemsByDate[key];
    if(!evs || !evs.length) return '';
    return '<div class="calendar-day-items">' +
      evs.map(ev=>{
        const c = `var(--dept-${DEPT_COLOR_KEY[ev.dept]})`;
        return `<div class="calendar-day-item" style="--item-color:${c}"><span class="item-dot"></span>${escapeHtml(ev.title||'(제목 없음)')}</div>`;
      }).join('') +
      '</div>';
  }

  let cells = '';
  for(let i=0;i<firstDow;i++) cells += `<span class="calendar-day-empty"></span>`;
  for(let day=1; day<=totalDays; day++){
    const d = new Date(year, month, day);
    const key = dateKey(d);
    const isToday = key === todayKey;
    const isSelected = key === state.reportSelectedDate;

/* ================= 월말보고서: 주차 기록 합산 ================= */
/* 이번 달에 속한 주차 기록을 모두 모아 지시 이행 현황을 계산 */
function monthlyMeetingSummary(monthKey){
  const mk = monthKey || monthKeyOf();
  const recs = loadWeekRecords();

  // 현재 진행 중인 주차도 포함
  if(meetingState.weekKey){
    recs[meetingState.weekKey] = recs[meetingState.weekKey] || {
      weekKey: meetingState.weekKey,
      next: meetingState.next || [],
      decisions: meetingState.decisions || [],
      review: meetingState.review || [],
      notes: meetingState.notes || ''
    };
  }

  const weeks = Object.keys(recs)
    .filter(k => monthKeyOfWeek(k) === mk)
    .sort();

  const byDept = {};
  DEPTS.forEach(d => byDept[d] = { issued:0, done:0, doing:0, carried:0, dropped:0, delayed:[] });
  let notes = [];

  weeks.forEach(wk => {
    const r = recs[wk] || {};
    (r.review || []).forEach(x => {
      const b = byDept[x.dept];
      if(!b) return;
      b.issued++;
      if(x.status === '완료') b.done++;
      else if(x.status === '진행중') b.doing++;
      else if(x.status === '이월') b.carried++;
      else if(x.status === '취소') b.dropped++;
      if((Number(x.carry)||0) >= 2 && x.status !== '완료' && x.status !== '취소'){
        b.delayed.push({ text:x.text, carry:Number(x.carry)||0 });
      }
    });
    if(r.notes && r.notes.trim()) notes.push(`· [${weekLabelOf(wk)}] ${r.notes.trim()}`);
  });

  let total = { issued:0, done:0, doing:0, carried:0, dropped:0 };
  DEPTS.forEach(d => {
    ['issued','done','doing','carried','dropped'].forEach(k => total[k] += byDept[d][k]);
  });
  const denom = Math.max(1, total.issued - total.dropped);
  total.rate = total.issued ? Math.round((total.done / denom) * 100) : 0;

  DEPTS.forEach(d => {
    const b = byDept[d];
    const dn = Math.max(1, b.issued - b.dropped);
    b.rate = b.issued ? Math.round((b.done / dn) * 100) : 0;
  });

  return { monthKey: mk, weeks, byDept, total, notes };
}

function execStrip(){
  const s = monthlyMeetingSummary();
  const cls = s.total.rate >= 80 ? 'good' : (s.total.rate >= 50 ? 'warn' : 'bad');
  const delayedCount = DEPTS.reduce((n,d)=> n + s.byDept[d].delayed.length, 0);
  return `
    <div class="exec-strip">
      <div class="exec-cell"><span class="exec-cell-label">집계된 주차</span><span class="exec-cell-val mono">${s.weeks.length}주</span></div>
      <div class="exec-cell"><span class="exec-cell-label">지시 이행률</span><span class="exec-cell-val mono ${cls}">${s.total.rate}%</span></div>
      <div class="exec-cell"><span class="exec-cell-label">완료 / 지시</span><span class="exec-cell-val mono">${s.total.done}/${s.total.issued}</span></div>
      <div class="exec-cell"><span class="exec-cell-label">이월 진행</span><span class="exec-cell-val mono">${s.total.carried + s.total.doing}건</span></div>
      <div class="exec-cell"><span class="exec-cell-label">2주+ 지연</span><span class="exec-cell-val mono ${delayedCount?'bad':''}">${delayedCount}건</span></div>
    </div>
    <div class="report-actions">
      <button class="report-gen-btn" onclick="openMonthlyReport()">📄 월말보고서 자동 생성</button>
    </div>`;
}

/* ================= 월말보고서 (양식 기반) ================= */
/* 제작물로 집계할 과·분류 매핑 */
const PRODUCT_SOURCES = {
  '문화기획과': ['기획PPT제작'],
  '영상제작과': ['제작물']
};

/* 활동내용 키워드 병합 규칙: [포함 키워드, 보고서 표기]
   제목에 키워드가 들어 있으면 하나로 합쳐 표기합니다. 위에서부터 먼저 맞는 규칙이 적용됩니다.
   새 키워드가 필요하면 여기에 한 줄만 추가하면 됩니다. */
const ACTIVITY_MERGE_RULES = [
  ['중계',     '예배·모임 중계'],
  ['주일예배', '주일예배 운영'],
  ['수요예배', '수요예배 운영'],
  ['전도대',   '전도대 운영 (요일별)'],
  ['전도의날', '전도의날 진행'],
  ['풍경촬영', '풍경촬영'],
  ['갤러리스토어', '갤러리스토어 제작'],
  ['시상식',   '시상식 수행'],
  ['부장님 대면', '부장님 대면 피드백'],
  ['주간모임', '주간모임 진행'],
  ['어린이예술단', '어린이예술단 인재모집']
];

function activityMergeKey(title){
  const t = String(title||'').replace(/\s+/g,'');
  for(const [kw] of ACTIVITY_MERGE_RULES){
    if(t.includes(kw.replace(/\s+/g,''))) return 'kw:' + kw;
  }
  return 'raw:' + t;
}
function activityMergeLabel(key, firstTitle){
  if(key.startsWith('kw:')){
    const kw = key.slice(3);
    const rule = ACTIVITY_MERGE_RULES.find(r => r[0] === kw);
    return rule ? rule[1] : firstTitle;
  }
  return firstTitle;
}

function sincheonYear(y){ return y - 1983; }

/* 활동내용 · 제작물현황 데이터 수집 (월 전체, 제목 기준 중복 제거) */
function monthlyFormData(){
  const { itemsByDate } = monthlyReportItems();
  const goals = (state.data && state.data.goals) || {};
  const s = monthlyMeetingSummary();

  const seenAct = new Set();
  const seenProd = new Set();
  const activities = [];
  const products = [];

  const allItems = [];
  Object.keys(itemsByDate).sort().forEach(k => itemsByDate[k].forEach(it => allItems.push(it)));
  // 부서 순서대로 정렬
  allItems.sort((a,b)=> ALL_DEPT_LIST.indexOf(a.dept) - ALL_DEPT_LIST.indexOf(b.dept));

  allItems.forEach(it => {
    const title = String(it.title || '').trim();
    if(!title) return;
    const isProduct = PRODUCT_SOURCES[it.dept] && PRODUCT_SOURCES[it.dept].includes(it.category);
    if(isProduct){
      const pk = title.replace(/\s+/g,' ');
      if(!seenProd.has(pk)){ seenProd.add(pk); products.push({ ...it, title }); }
    }
    if(!isProduct){
      const ak = activityMergeKey(title);
      if(!seenAct.has(ak)){
        seenAct.add(ak);
        activities.push({ ...it, title: activityMergeLabel(ak, title) });
      }
    }
  });

  // 마일스톤 달성 항목도 활동내용에 포함
  const msLines = [];
  DEPTS.forEach(d => {
    (goals[d] || []).forEach(g => {
      const done = Number(g.current) >= Number(g.target);
      const line = `${g.title} (${g.current}/${g.target}${g.unit || '건'}${done ? ' 완료' : ' 진행'})`;
      const k = line.replace(/\s+/g,' ');
      if(!seenAct.has(k)){ seenAct.add(k); msLines.push(line); }
    });
  });

  // 지시사항 이행 완료 항목도 활동내용에 포함
  const dirLines = [];
  Object.values(loadWeekRecords()).forEach(r => {
    if(monthKeyOfWeek(r.weekKey) !== s.monthKey) return;
    (r.review || []).forEach(x => {
      if(x.status !== '완료') return;
      const line = `${x.text} 완료`;
      const k = line.replace(/\s+/g,' ');
      if(!seenAct.has(k)){ seenAct.add(k); dirLines.push(line); }
    });
  });
  (meetingState.review || []).forEach(x => {
    if(x.status !== '완료') return;
    const line = `${x.text} 완료`;
    const k = line.replace(/\s+/g,' ');
    if(!seenAct.has(k)){ seenAct.add(k); dirLines.push(line); }
  });

  // 차월계획: 현재 남아있는 차주업무 + 이월 항목 (중복 제거)
  const seenNext = new Set();
  const nextPlans = [];
  [...(meetingState.next || []), ...(meetingState.review || []).filter(x => x.status === '이월' || x.status === '진행중')]
    .forEach(x => {
      const t = String(x.text || '').trim();
      const k = t.replace(/\s+/g,' ');
      if(t && !seenNext.has(k)){ seenNext.add(k); nextPlans.push(t); }
    });

  const mk = s.monthKey;
  const [yy, mm] = mk.split('-').map(Number);
  return { activities, products, msLines, dirLines, nextPlans, year: yy, month: mm };
}

/* ---- Word(.docx) 생성 : docx 라이브러리를 필요할 때 로드 ---- */
let docxLibPromise = null;
function loadDocxLib(){
  if(window.docx) return Promise.resolve(window.docx);
  if(docxLibPromise) return docxLibPromise;
  docxLibPromise = new Promise((resolve, reject) => {
    const sc = document.createElement('script');
    sc.src = 'https://unpkg.com/docx@8.5.0/build/index.umd.js';
    sc.onload = () => window.docx ? resolve(window.docx) : reject(new Error('docx 로드 실패'));
    sc.onerror = () => reject(new Error('docx 스크립트를 불러오지 못했습니다. 인터넷 연결을 확인해주세요.'));
    document.head.appendChild(sc);
  });
  return docxLibPromise;
}

async function downloadMonthlyDocx(btn){
  if(btn){ btn.disabled = true; btn.textContent = '생성 중…'; }
  try{
    const D = await loadDocxLib();
    const d = monthlyFormData();
    const now = new Date();

    const P = (text, opt={}) => new D.Paragraph({
      alignment: opt.center ? D.AlignmentType.CENTER : D.AlignmentType.LEFT,
      spacing: { after: opt.after != null ? opt.after : 120 },
      children: [ new D.TextRun({ text, bold: !!opt.bold, size: (opt.pt || 11) * 2, font: '맑은 고딕' }) ]
    });

    const boxTable = lines => new D.Table({
      width: { size: 9360, type: D.WidthType.DXA },
      columnWidths: [9360],
      rows: [ new D.TableRow({ children: [ new D.TableCell({
        width: { size: 9360, type: D.WidthType.DXA },
        margins: { top: 160, bottom: 160, left: 200, right: 200 },
        children: lines.length
          ? lines.map(t => P('- ' + t, { after: 60 }))
          : [ P('- (해당 없음)', { after: 60 }) ]
      }) ] }) ]
    });

    const actLines = [
      ...d.activities.map(x => x.title),
      ...d.msLines,
      ...d.dirLines
    ];
    const prodLines = d.products.map(x => x.title);

    /* 재정현황 5열 표 (수기 작성용) */
    const finCols = ['전월이월금','월입금','월출금','월잔액','회계잔금'];
    const finCell = (text, bold) => new D.TableCell({
      width: { size: 1872, type: D.WidthType.DXA },
      margins: { top: 100, bottom: 100, left: 100, right: 100 },
      children: [ new D.Paragraph({
        alignment: D.AlignmentType.CENTER,
        children: [ new D.TextRun({ text, bold: !!bold, size: 22, font: '맑은 고딕' }) ]
      }) ]
    });
    const finTable = new D.Table({
      width: { size: 9360, type: D.WidthType.DXA },
      columnWidths: [1872,1872,1872,1872,1872],
      rows: [
        new D.TableRow({ children: finCols.map(c => finCell(c, true)) }),
        new D.TableRow({ children: finCols.map(() => finCell(' ')) })
      ]
    });

    const doc = new D.Document({ sections: [{
      properties: {},
      children: [
        P('요한지파 이천교회 문화부 월말보고서', { center:true, bold:true, pt:20, after:80 }),
        P(`(신천기 ${sincheonYear(d.year)}년(${d.year}) ${d.month}월분)`, { center:true, pt:12, after:300 }),
        P('1. 활동내용', { bold:true, pt:13, after:120 }),
        boxTable(actLines),
        P('', { after:200 }),
        P('2. 재정현황(회계잔금에 정기예금 0원 포함)', { bold:true, pt:13, after:120 }),
        finTable,
        P('', { after:200 }),
        P('3. 제작물현황', { bold:true, pt:13, after:120 }),
        boxTable(prodLines),
        P('', { after:200 }),
        P('4. 차월계획', { bold:true, pt:13, after:120 }),
        boxTable(d.nextPlans),
        P('', { after:300 }),
        P('위와 같이 보고합니다.', { center:true, pt:12, after:80 }),
        P(`신천기 ${sincheonYear(now.getFullYear())}년(${now.getFullYear()}) ${now.getMonth()+1}월 ${now.getDate()}일`, { center:true, pt:12, after:80 }),
        P('보고자 : 문화부장', { center:true, pt:12, after:0 })
      ]
    }]});

    const blob = await D.Packer.toBlob(doc);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `문화부_월말보고서_${d.year}-${String(d.month).padStart(2,'0')}.docx`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
    showMeetingToast('Word 파일이 저장되었습니다.');
  }catch(e){
    console.error(e);
    showMeetingToast(e.message || 'Word 생성에 실패했습니다.');
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = '📝 Word(.docx) 저장'; }
  }
}

  ]));

    <p class="section-label">${dept} · 분류별 현황</p>
    ${allCats.length
      ? allCats.map(c=>catCard(dept, deptData, c, dept + '|' + c)).join('')
      : `<div class="state-box">이 부서에 등록된 분류가 아직 없습니다.</div>`}`;
}

function closeDeptModal(){
  state.dept = null;
  state.openCats.clear();
  render();
}

function renderDeptModal(){
  const host = document.getElementById('deptDetailHost');
  if(!host) return;

  if(!state.dept || !state.data){ host.innerHTML = ''; return; }

  const isAll = state.dept === ALL_DEPTS;
  const title = isAll ? '전체 부서' : state.dept;
  const color = isAll ? 'var(--blue)' : `var(--dept-${DEPT_COLOR_KEY[state.dept]})`;

  const rangeTabs = ['weekly','monthly','yearly'].map(r=>{
    const label = { weekly:'주간', monthly:'월간', yearly:'연간' }[r];
    return `<button class="range-tab ${state.range===r?'active':''}" data-modal-range="${r}">${label}</button>`;
  }).join('');

  host.innerHTML = `
    <div class="dept-modal-overlay" onclick="if(event.target===this)closeDeptModal()">
      <div class="dept-modal" style="--dept-color:${color}">
        <div class="dept-modal-head">
          <h2 class="dept-modal-title">${escapeHtml(title)}</h2>
          <div class="range-tabs">${rangeTabs}</div>
          <button class="dept-modal-close" onclick="closeDeptModal()" title="닫기">✕</button>
        </div>
        <div class="dept-modal-body">
          <div id="modalMilestone"></div>
          <div id="modalSchedule"></div>
          <main id="modalMain"></main>
        </div>
      </div>
    </div>`;

  /* 마일스톤 / 월말보고 */
  const msWrap = document.getElementById('modalMilestone');
  if(isAll){
    msWrap.innerHTML = renderMonthlyReportSection();
    bindReportCalendarEvents();
  } else {
    msWrap.innerHTML = milestoneSection(state.dept);
    bindMilestoneEvents();
  }

  /* 일정 */
  renderScheduleInto('modalSchedule');

  /* 분류별 현황 */
  const modalMain = document.getElementById('modalMain');
  modalMain.innerHTML = isAll
    ? ALL_DEPT_LIST.map(deptSectionHtml).join('') + queueSection()
    : deptSectionHtml(state.dept) + queueSection();

  modalMain.querySelectorAll('[data-toggle]').forEach(btn=>{
    btn.onclick = ()=>{
      const key = btn.dataset.toggle;
      if(state.openCats.has(key)) state.openCats.delete(key); else state.openCats.add(key);
      render();
    };
  });

  host.querySelectorAll('[data-modal-range]').forEach(btn=>{
    btn.onclick = ()=>{ state.range = btn.dataset.modalRange; render(); };
  });
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function showError(){
  document.getElementById('main').innerHTML = `
    <div class="state-box">
      <p class="big">데이터를 불러오지 못했습니다</p>
      네트워크 상태를 확인하거나 잠시 후 다시 시도해주세요.
      <br><button class="retry-btn" onclick="load()">다시 시도</button>
    </div>`;
}

function renderAlertBanner(){
  const wrap = document.getElementById('alertBanner');
  const now = new Date();
  const day = now.getDay();
  const hour = now.getHours();
  const forceTest = new URLSearchParams(location.search).get('forceAlert') === '1';
  const inWindow = forceTest || (day === 6 && (hour === 20 || hour === 21 || hour === 22));

  const unreported = (state.data && state.data.unreportedDepartments) || [];

  if(!inWindow || unreported.length === 0){ wrap.innerHTML=''; return; }

  const dismissKey = 'alertDismissed-' + now.toISOString().slice(0,10) + '-' + hour;
  let dismissed = false;
  try{ dismissed = localStorage.getItem(dismissKey) === '1'; }catch(e){}
  if(dismissed){ wrap.innerHTML=''; return; }

  wrap.innerHTML = `
    <div class="alert-banner">
      <span class="alert-icon"></span>
      <div class="alert-body">
        <p class="alert-title">이번 주 미보고 부서 ${unreported.length}곳</p>
        <p class="alert-desc">${unreported.join(', ')} — 오늘(토요일) 안에 보고 부탁드립니다.</p>
      </div>
      <button class="alert-close" id="alertCloseBtn">×</button>
    </div>`;

  document.getElementById('alertCloseBtn').onclick = ()=>{
    try{ localStorage.setItem(dismissKey, '1'); }catch(e){}
    wrap.innerHTML = '';
  };
}

async function load(){
  if(!state.data){
    document.getElementById('main').innerHTML = `<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>`;
  }
  try{
    const res = await fetch(API_URL);
    if(!res.ok) throw new Error('bad status');
    state.data = await res.json();
    
    if(state.data && state.data.sharedMeeting) {
      if(state.data.sharedMeeting.decisions) {
        state.data.sharedMeeting.decisions = state.data.sharedMeeting.decisions.filter(x => x.dept !== '전체' && x.text !== 'ㄴㅇㄹㄴㅇㄹ');
      }
      if(state.data.sharedMeeting.next) {
        state.data.sharedMeeting.next = state.data.sharedMeeting.next.filter(x => x.dept !== '전체' && x.text !== 'ㄴㅇㄹㄴㅇㄹ');
      }
    }

    syncSermonFromServer();
    syncMeetingFromServer();

    await checkMonthlyMilestoneReset();
    if(document.activeElement && document.activeElement.closest && document.activeElement.closest('.ms-form')){
      renderVisitFooter();
      renderSharedFollowup();
      return;
    }
    render();
    renderSharedFollowup();
    renderAlertBanner();
    renderNoticeToast();
    renderVisitFooter();
  }catch(err){
    console.error(err);
    showError();
  }
}

/* ================= 말씀 전달 로직 ================= */
const SERMON_KEY='cultureSermonPrepV3';

const PPT_STYLE_DEFAULT={
  font:'Noto Sans KR',
  theme:'dark',
  accent:'#FF9F0A',
  titleSize:34,
  headingSize:20,
  bodySize:18,
  align:'LEFT',
  margin:'normal',
  charsPerSlide:380,
  showCover:1,
  showOutro:1
};

const PPT_FONT_OPTIONS=[
  ['Noto Sans KR','본고딕 (기본)'],
  ['Nanum Gothic','나눔고딕'],
  ['Nanum Myeongjo','나눔명조'],
  ['Gothic A1','고딕 A1'],
  ['Gowun Dodum','고운돋움'],
  ['Do Hyeon','도현체'],
  ['Jua','주아체'],
  ['Black Han Sans','검은고딕']
];
const PPT_THEME_OPTIONS=[['dark','다크 (검정)'],['navy','딥네이비'],['ink','잉크블랙'],['light','라이트 (흰색)']];
const PPT_ACCENT_OPTIONS=[['#FF9F0A','오렌지'],['#0A84FF','블루'],['#30D158','그린'],['#BF5AF2','퍼플'],['#FF453A','레드'],['#8E8E93','그레이']];
const PPT_MARGIN_OPTIONS=[['narrow','좁게 (글자 크게)'],['normal','보통'],['wide','넓게 (여백 크게)']];

let sermonState={topic:'', main:'', pptUrl:'', embedUrl:'', savedAt:'', updatedAt:'', updatedBy:'', pptNonce:0, pptStyle:{...PPT_STYLE_DEFAULT}};
let sermonDirty=false;
let sermonSyncedOnce=false;
let pptStyleOpen=false;

function pptStyle(){ return {...PPT_STYLE_DEFAULT, ...(sermonState.pptStyle||{})}; }

function loadSermonLocal(){
  try{
    const raw=JSON.parse(localStorage.getItem(SERMON_KEY)||'{}');
    sermonState={...sermonState,...raw};
    sermonState.pptStyle={...PPT_STYLE_DEFAULT,...(raw.pptStyle||{})};
  }catch(e){}
}
function persistSermonLocal(){
  try{ localStorage.setItem(SERMON_KEY,JSON.stringify(sermonState)); }catch(e){}
}
function isTypingInSermon(){
  const a=document.activeElement;
  if(!a||!a.closest||!a.closest('#sermonPrep')) return false;
  return a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT';
}

function syncSermonFromServer(){
  const s=state.data && state.data.sharedSermon;
  if(!s) return;
  if(sermonDirty || isTypingInSermon()) return;

  const serverTime=Date.parse(s.updatedAt||'')||0;
  const localTime=Date.parse(sermonState.updatedAt||'')||0;
  if(sermonSyncedOnce && serverTime<localTime) return;

  const prevPpt=sermonState.pptUrl;
  sermonState.topic    = s.topic||'';
  sermonState.main     = s.main||'';
  sermonState.pptUrl   = s.pptUrl||'';
  sermonState.embedUrl = s.embedUrl||'';
  sermonState.updatedAt= s.updatedAt||'';
  sermonState.updatedBy= s.updatedBy||'';
  sermonState.pptStyle = {...PPT_STYLE_DEFAULT, ...(s.pptStyle||{})};
  if(prevPpt!==sermonState.pptUrl) sermonState.pptNonce=Date.now();
  if(s.updatedAt){
    const d=new Date(s.updatedAt);
    if(!isNaN(d)) sermonState.savedAt=d.toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  }
  sermonSyncedOnce=true;
  persistSermonLocal();
  if(document.body.classList.contains('prep-active')) renderSermonPrep();
}

let sermonSaveTimer=null;
async function pushSermonToServer(show){
  try{
    const res=await apiAction('sermonSave',{data:JSON.stringify({
      topic:    sermonState.topic||'',
      main:     sermonState.main||'',
      pptUrl:   sermonState.pptUrl||'',
      embedUrl: sermonState.embedUrl||'',
      pptStyle: pptStyle()
    })});
    if(res && res.ok){
      sermonDirty=false;
      sermonSyncedOnce=true;
      if(res.sermon && res.sermon.updatedAt){
        sermonState.updatedAt=res.sermon.updatedAt;
        const d=new Date(res.sermon.updatedAt);
        if(!isNaN(d)) sermonState.savedAt=d.toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
      }
      persistSermonLocal();
      if(show) showMeetingToast('문화부 전체에 공유 저장되었습니다 ✅');
      return true;
    }
    if(show) showMeetingToast('서버 저장 실패 — Apps Script 배포 권한을 확인해 주세요.');
  }catch(e){
    console.error(e);
    if(show) showMeetingToast('서버 저장 실패 — 네트워크를 확인해 주세요.');
  }
  return false;
}

function saveSermonState(show=false){
  sermonDirty=true;
  persistSermonLocal();
  renderPrepSaved();
  clearTimeout(sermonSaveTimer);
  sermonSaveTimer=setTimeout(async()=>{
    await pushSermonToServer(show);
    renderPrepSaved();
  }, show?0:900);
}

function updateSermon(k,v){ sermonState[k]=v; saveSermonState(false); }

function updatePptStyle(k,v){
  const st=pptStyle();
  st[k]=(typeof PPT_STYLE_DEFAULT[k]==='number')?Number(v):v;
  sermonState.pptStyle=st;
  const label=document.getElementById('pptv-'+k);
  if(label) label.textContent=(k==='charsPerSlide')?(st[k]+'자'):(st[k]+'pt');
  saveSermonState(false);
}

function togglePptStyle(){
  pptStyleOpen=!pptStyleOpen;
  const el=document.getElementById('pptStylePanel');
  if(el) el.classList.toggle('open', pptStyleOpen);
}

async function reloadSermonFromServer(){
  sermonDirty=false;
  sermonSyncedOnce=false;
  showMeetingToast('최신 공유본을 불러오는 중...');
  await load();
  syncSermonFromServer();
  renderSermonPrep();
  showMeetingToast('최신 공유본을 불러왔습니다.');
}

function renderPrepSaved(){
  const e=document.getElementById('prepSaved');
  if(!e) return;
  if(sermonDirty){ e.textContent='저장 대기 중… (자동 저장됩니다)'; return; }
  e.textContent = sermonState.savedAt ? `전체 공유 저장됨 · ${sermonState.savedAt}` : '작성 후 자동으로 전체 공유됩니다';
}

async function createPptFromSermon(){
  const topic=(sermonState.topic||'').trim();
  const main=(sermonState.main||'').trim();
  if(!topic && !main){ showMeetingToast('주제 또는 상세 전달 내용을 입력해 주세요.'); return; }

  const rebuilding=!!sermonState.pptUrl;
  showMeetingToast(rebuilding?'디자인을 반영해 슬라이드를 다시 그리는 중… ⏳':'내용을 저장하고 PPT를 제작합니다… ⏳');
  await pushSermonToServer(false);

  try{
    const res=await apiAction('createPPT',{ data:JSON.stringify({
      topic, main,
      date:new Date().toISOString().slice(0,10),
      style:pptStyle()
    })});
    if(res && res.ok){
      sermonState.pptUrl   = res.editUrl || res.url || '';
      sermonState.embedUrl = res.embedUrl || '';
      sermonState.pptNonce = Date.now();
      persistSermonLocal();
      await pushSermonToServer(false);
      renderSermonPrep();
      showMeetingToast(res.warning ? ('완료 — ' + res.warning) : (rebuilding?'디자인이 반영되었습니다 🎨':'PPT가 생성되어 전체에 공유되었습니다 🎉'));
    }else{
      showMeetingToast('PPT 생성 실패: ' + ((res && res.error) || '알 수 없는 오류'));
    }
  }catch(e){
    console.error(e);
    showMeetingToast('PPT 제작 요청 중 오류가 발생했습니다.');
  }
}

function openPptEditor(){
  if(!sermonState.pptUrl){ showMeetingToast('먼저 PPT를 제작해 주세요.'); return; }
  window.open(sermonState.pptUrl,'_blank','noopener');
}

function toEmbedUrl(url){
  if(!url) return '';
  const m=String(url).match(/\/d\/([a-zA-Z0-9-_]+)/);
  return m ? `https://docs.google.com/presentation/d/${m[1]}/embed?start=false&loop=false&delayms=3000` : '';
}

function selectField(key,label,options){
  const cur=String(pptStyle()[key]);
  const opts=options.map(([v,t])=>`<option value="${escapeHtml(String(v))}" ${String(v)===cur?'selected':''}>${escapeHtml(t)}</option>`).join('');
  return `<label class="ppt-style-field"><span>${escapeHtml(label)}</span>
    <select onchange="updatePptStyle('${key}',this.value)">${opts}</select></label>`;
}
function rangeField(key,label,min,max,step,suffix){
  const v=pptStyle()[key];
  return `<label class="ppt-style-field"><span>${escapeHtml(label)}<b class="ppt-style-val" id="pptv-${key}">${v}${suffix}</b></span>
    <input type="range" min="${min}" max="${max}" step="${step}" value="${v}" oninput="updatePptStyle('${key}',this.value)"></label>`;
}

/* ================= 주간 피드백 회의모드 데이터/렌더링 ================= */
const MEETING_KEY='cultureMeetingModeV1';

const WEEK_RECORDS_KEY='cultureWeeklyRecordsV1';

let meetingState={
  deptIndex:0,
  weekKey:'',
  decisions:[], 
  next:[],      
  review:[],
  notes:'',
  updatedAt:''
};

/* ---- 주차별 회의 기록 보관 (덮어쓰기 방지) ---- */
function loadWeekRecords(){
  try{ return JSON.parse(localStorage.getItem(WEEK_RECORDS_KEY)||'{}') || {}; }
  catch(e){ return {}; }
}
function saveWeekRecords(recs){
  try{ localStorage.setItem(WEEK_RECORDS_KEY, JSON.stringify(recs)); }catch(e){}
}
function snapshotCurrentWeek(){
  if(!meetingState.weekKey) return;
  const recs = loadWeekRecords();
  recs[meetingState.weekKey] = {
    weekKey: meetingState.weekKey,
    savedAt: new Date().toISOString(),
    notes: meetingState.notes || '',
    next: JSON.parse(JSON.stringify(meetingState.next || [])),
    decisions: JSON.parse(JSON.stringify(meetingState.decisions || [])),
    review: JSON.parse(JSON.stringify(meetingState.review || []))
  };
  saveWeekRecords(recs);
}

/* ---- 항목 정규화: 모든 항목에 고유 id / 상태 / 이월횟수 부여 ---- */
function normalizeItem(x, type){
  const base = (typeof x === 'string') ? { text:x } : (x || {});
  return {
    id: base.id || uid(),
    text: String(base.text || ''),
    dept: base.dept || '전체',
    type: base.type || type || 'next',
    done: !!base.done,
    status: base.status || (base.done ? '완료' : '대기'),
    carry: Number(base.carry) || 0,
    weekKey: base.weekKey || meetingState.weekKey || weekKeyOf(),
    createdAt: base.createdAt || new Date().toISOString(),
    comments: Array.isArray(base.comments) ? base.comments : [],
    ...(base.carriedFrom ? { carriedFrom: base.carriedFrom } : {}),
    ...(base.srcType ? { srcType: base.srcType } : {}),
    ...(base.fromWeek ? { fromWeek: base.fromWeek } : {})
  };
}
function normalizeMeetingState(){
  const clean = (arr, type) => (Array.isArray(arr)?arr:[])
    .map(x => normalizeItem(x, type))
    .filter(x => x.dept !== '전체' && x.text && x.text !== 'ㄴㅇㄹㄴㅇㄹ');
  meetingState.next = clean(meetingState.next, 'next');
  meetingState.decisions = clean(meetingState.decisions, 'decisions');
  meetingState.review = clean(meetingState.review, 'review');
}

/* ---- 주가 바뀌면: 지난주 기록을 저장하고, 미완료 항목을 '회수 목록'으로 넘김 ---- */
function checkWeeklyReset(){
  const cur = weekKeyOf();
  if(!meetingState.weekKey){ meetingState.weekKey = cur; return false; }
  if(meetingState.weekKey === cur) return false;

  const prevKey = meetingState.weekKey;
  snapshotCurrentWeek();

  // ★ 완료 항목 → .archived=true (데이터 유지, 화면 비표시)
  // ★ 미완료 항목 → .carry++ 증가 (다음 주로 자동 이월)
  const processed = [...(meetingState.next||[]), ...(meetingState.decisions||[])].map(x => {
    if(x.done || x.status === '완료' || x.status === '취소') {
      return { ...x, archived: true };  // 완료 → 숨김
    } else {
      return { ...x, carry: (Number(x.carry)||0) + 1, status: '대기' };  // 미완료 → carry++
    }
  });

  const stillOpen = (meetingState.review||[]).map(x => {
    if(x.status === '완료' || x.status === '취소') {
      return { ...x, archived: true };  // 완료 → 숨김
    } else {
      return { ...x, status:'대기', carry: (Number(x.carry)||0) + 1 };  // 미완료 → carry++
    }
  });

  meetingState.review = [...stillOpen, ...processed];
  meetingState.next = [];
  meetingState.decisions = [];
  meetingState.notes = '';
  meetingState.weekKey = cur;
  return true;
}

function loadMeetingState(){
  try{
    meetingState={...meetingState,...JSON.parse(localStorage.getItem(MEETING_KEY)||'{}')};
  }catch(e){}

  normalizeMeetingState();
  if(checkWeeklyReset()){
    normalizeMeetingState();
    try{ localStorage.setItem(MEETING_KEY, JSON.stringify(meetingState)); }catch(e){}
  }

  if(state.data?.sharedMeeting){
    const sm = state.data.sharedMeeting;
    if(sm.decisions) sm.decisions = sm.decisions.filter(x => x.dept !== '전체' && x.text !== 'ㄴㅇㄹㄴㅇㄹ');
    if(sm.next) sm.next = sm.next.filter(x => x.dept !== '전체' && x.text !== 'ㄴㅇㄹㄴㅇㄹ');
  }
}

/* ---- 서버(공용) 기록이 더 최신이면 받아오기 : 기기 간 덮어쓰기 방지 ---- */
function syncMeetingFromServer(){
  const sm = state.data && state.data.sharedMeeting;
  if(!sm || typeof sm !== 'object') return;

  const isEditing = document.activeElement &&
    document.activeElement.closest &&
    (document.activeElement.closest('.pf-card') || document.activeElement.closest('.pf-memo-card') || document.activeElement.closest('.pf-review-card') || document.activeElement.closest('.task-modal'));
  if(isEditing) return;

  const sTime = new Date(sm.updatedAt || sm.completedAt || 0).getTime() || 0;
  const lTime = new Date(meetingState.updatedAt || 0).getTime() || 0;
  if(sTime <= lTime) return;

  meetingState = {
    ...meetingState,
    weekKey: sm.weekKey || meetingState.weekKey,
    next: sm.next || [],
    decisions: sm.decisions || [],
    review: sm.review || [],
    notes: typeof sm.notes === 'string' ? sm.notes : meetingState.notes,
    updatedAt: sm.updatedAt || sm.completedAt || ''
  };
  normalizeMeetingState();
  checkWeeklyReset();
  try{ localStorage.setItem(MEETING_KEY, JSON.stringify(meetingState)); }catch(e){}
}

let meetingSaveTimer=null;
function saveMeetingState(immediate=false){
  if(!meetingState.weekKey) meetingState.weekKey = weekKeyOf();
  meetingState.updatedAt = new Date().toISOString();
  snapshotCurrentWeek();

  const generatedText = generateMeetingText();
  const x = {
    ...meetingState,
    status: '완료',
    weekKey: meetingState.weekKey,
    weekLabel: weekLabelOf(meetingState.weekKey),
    updatedAt: meetingState.updatedAt,
    completedAt: new Date().toISOString(),
    minutes: generatedText,
    sermon: sermonState
  };

  try{ localStorage.setItem(MEETING_KEY, JSON.stringify(x)); }catch(e){}
  clearTimeout(meetingSaveTimer);

  meetingSaveTimer = setTimeout(async () => {
    try {
      await apiAction('meetingSave', { data: JSON.stringify(x) });
      renderSharedFollowup();
      if(immediate) showMeetingToast('회의록 저장 및 공용 공유가 완료되었습니다.');
    } catch(e) {
      console.error(e);
    }
  }, immediate ? 0 : 650);
}

function generateMeetingText(src){
  const s = src || meetingState;
  const formatListByDept = (items) => {
    if(!items || items.length === 0) return '없음';
    let res = [];
    DEPTS.forEach(d => {
      const dItems = items.filter(x => x.dept === d);
      if(dItems.length > 0){
        res.push(`[${d}]`);
        dItems.forEach((x, i) => res.push(`  ${i+1}. ${x.text}`));
      }
    });
    return res.length > 0 ? res.join('\n') : '없음';
  };

  const formatReview = (items) => {
    if(!items || items.length === 0) return '없음';
    let res = [];
    DEPTS.forEach(d => {
      const dItems = items.filter(x => x.dept === d);
      if(dItems.length > 0){
        res.push(`[${d}]`);
        dItems.forEach((x, i) => {
          const mark = { '완료':'✅', '진행중':'🔄', '이월':'➡️', '취소':'⛔' }[x.status] || '▫️';
          const carry = (Number(x.carry) || 0) > 0 ? ` (${x.carry}주 지연)` : '';
          res.push(`  ${i+1}. ${mark} ${x.text} · ${x.status || '미확인'}${carry}`);
        });
      }
    });
    return res.length > 0 ? res.join('\n') : '없음';
  };

  const all = reviewStats(null, s.review);

  return `[문화부 주간 피드백 전체 회의록]
주차: ${weekLabelOf(s.weekKey)} (${s.weekKey})
일시: ${s.savedAt ? new Date(s.savedAt).toLocaleString('ko-KR') : new Date().toLocaleString('ko-KR')}

■ 1. 지난주 지시 이행 결과 (이행률 ${all.rate}% · 완료 ${all.done}건 / 이월 ${all.carried}건 / 진행중 ${all.doing}건)
${formatReview(s.review)}

■ 2. 회의 총평 및 특이사항 메모 (문화부 전체)
${s.notes || '없음'}

■ 3. 차주에 할 일 (과별 계획)
${formatListByDept(s.next)}

■ 4. 과별 피드백 및 지시사항
${formatListByDept(s.decisions)}`;
}

function addFeedbackItem(type){
  const inputEl = document.getElementById(type === 'next' ? 'inputNext' : 'inputDecisions');
  const val = inputEl ? inputEl.value.trim() : '';
  if(!val) return;

  const currentDept = DEPTS[meetingState.deptIndex] || DEPTS[0];
  if(!meetingState[type]) meetingState[type] = [];

  meetingState[type].push(normalizeItem({
    text: val,
    dept: currentDept,
    type: type,
    weekKey: meetingState.weekKey || weekKeyOf()
  }, type));

  inputEl.value = '';
  saveMeetingState();
  renderMeetingMode();
}

function removeFeedbackItem(type, id){
  if(!meetingState[type]) return;
  meetingState[type] = meetingState[type].filter(x => x.id !== id);
  saveMeetingState();
  renderMeetingMode();
}

/* ================= 지난주 지시 회수 처리 ================= */
function setReviewStatus(id, status){
  const list = meetingState.review || [];
  const idx = list.findIndex(x => x.id === id);
  if(idx < 0) return;
  const item = list[idx];

  if(item.status === status){ item.status = '대기'; item.done = false; }
  else { item.status = status; item.done = (status === '완료'); }

  if(item.status === '이월'){
    const target = (item.srcType === 'decisions' || item.type === 'decisions') ? 'decisions' : 'next';
    if(!meetingState[target]) meetingState[target] = [];
    const already = meetingState[target].some(x => x.carriedFrom === item.id);
    if(!already){
      meetingState[target].push(normalizeItem({
        text: item.text,
        dept: item.dept,
        type: target,
        carry: (Number(item.carry)||0) + 1,
        carriedFrom: item.id,
        weekKey: meetingState.weekKey || weekKeyOf()
      }, target));
    }
  } else {
    ['next','decisions'].forEach(t => {
      if(meetingState[t]) meetingState[t] = meetingState[t].filter(x => x.carriedFrom !== item.id);
    });
  }

  saveMeetingState();
  renderMeetingMode();
}

/* 수동 주 마감: 일요일 자동 전환을 기다리지 않고 지금 한 주를 닫아본다 */
function forceWeekClose(){
  const cnt = (meetingState.next||[]).length + (meetingState.decisions||[]).length;
  if(!confirm(`이번 주(${weekLabelOf(meetingState.weekKey)})를 마감합니다.\n\n· 현재 차주업무/지시사항 ${cnt}건이 '지난주 지시 확인' 목록으로 넘어갑니다.\n· 이번 주 기록은 주차별로 따로 보관됩니다.\n\n진행할까요?`)) return;

  snapshotCurrentWeek();
  const prevKey = meetingState.weekKey;

  const unresolved = [...(meetingState.next||[]), ...(meetingState.decisions||[])]
    .filter(x => !x.done && x.status !== '완료' && x.status !== '취소')
    .map(x => ({ ...x, status:'대기', fromWeek: prevKey, srcType: x.type }));
  const stillOpen = (meetingState.review||[])
    .filter(x => x.status !== '완료' && x.status !== '취소' && x.status !== '이월')
    .map(x => ({ ...x, status:'대기', carry:(Number(x.carry)||0)+1 }));

  meetingState.review = [...stillOpen, ...unresolved];
  meetingState.next = [];
  meetingState.decisions = [];
  meetingState.notes = '';
  meetingState.weekKey = weekKeyOf();

  saveMeetingState(true);
  renderMeetingMode();
  renderSharedFollowup();
  showMeetingToast('주 마감 완료 · 미완료 항목이 회수 목록으로 넘어갔습니다.');
}

function removeReviewItem(id){
  meetingState.review = (meetingState.review||[]).filter(x => x.id !== id);
  ['next','decisions'].forEach(t => {
    if(meetingState[t]) meetingState[t] = meetingState[t].filter(x => x.carriedFrom !== id);
  });
  saveMeetingState();
  renderMeetingMode();
}

/* 회수 통계 (부서 지정 시 해당 부서만) */
function reviewStats(dept, listSrc){
  const list = (listSrc || meetingState.review || []).filter(x => !dept || x.dept === dept);
  const done = list.filter(x => x.status === '완료').length;
  const dropped = list.filter(x => x.status === '취소').length;
  const denom = Math.max(1, list.length - dropped);
  return {
    total: list.length,
    done,
    doing: list.filter(x => x.status === '진행중').length,
    carried: list.filter(x => x.status === '이월').length,
    dropped,
    pending: list.filter(x => x.status === '대기').length,
    rate: list.length ? Math.round((done / denom) * 100) : 0
  };
}

async function apiAction(action,params={}){
  const parse=t=>{ try{return JSON.parse(t)}catch(e){return {ok:t==='ok',raw:t}} };
  try{
    const r=await fetch(API_URL,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action,...params}),
      redirect:'follow'
    });
    return parse(await r.text());
  }catch(err){
    const q=new URLSearchParams({action,...params});
    const r=await fetch(API_URL+'?'+q.toString(),{cache:'no-store'});
    return parse(await r.text());
  }
}

function normalizeSharedMeeting(raw){
  const base=raw&&typeof raw==='object'?raw:{};
  const fix=(arr,type)=>(Array.isArray(arr)?arr:[])
    .map(x=>normalizeItem(x,type))
    .filter(x => x.dept !== '전체' && x.text && x.text !== 'ㄴㅇㄹㄴㅇㄹ');

  return {...base,
    weekKey: base.weekKey || meetingState.weekKey || weekKeyOf(),
    decisions:fix(base.decisions,'decisions'),
    next:fix(base.next,'next'),
    review:fix(base.review,'review')};
}

/* 서버 동기화(syncMeetingFromServer)가 최신본을 meetingState에 반영하므로 로컬을 기준으로 사용 */
function getSharedMeeting(){
  return normalizeSharedMeeting(meetingState||{});
}

function getMeetingArchiveData(){
  const server=Array.isArray(state.data?.meetingArchive)?state.data.meetingArchive:[];
  let local=[];try{local=JSON.parse(localStorage.getItem('cultureMeetingArchiveV1')||'[]')}catch(e){}
  const current=getSharedMeeting();
  const currentFinished=current.status==='완료'?( [{id:current.id||current.completedAt||'current',status:'완료',startedAt:current.startedAt||'',endedAt:current.completedAt||'',weekKey:current.weekKey,seconds:current.seconds||0,decisions:current.decisions||[],next:current.next||[],review:current.review||[],notes:current.notes||'',minutes:current.minutes||generateMeetingText(current)}] ):[];

  /* 주차별 저장 기록(weekRecords)도 아카이브에 포함 — 저장할 때마다 이 목록에서 바로 조회 가능 */
  const weekRecs = Object.values(loadWeekRecords())
    .filter(r => r.weekKey && r.weekKey !== meetingState.weekKey)
    .map(r => ({
      id: 'week-' + r.weekKey,
      weekKey: r.weekKey,
      status: '완료',
      startedAt: r.savedAt || '',
      endedAt: r.savedAt || '',
      next: r.next || [],
      decisions: r.decisions || [],
      review: r.review || [],
      notes: r.notes || '',
      minutes: generateMeetingText(r)
    }));

  const all=[...server,...currentFinished,...local,...weekRecs];
  const seen=new Set();
  return all.filter(x=>{const k=String(x.weekKey||x.id||x.endedAt||x.startedAt||'');if(!k||seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>new Date(b.endedAt||b.startedAt||0)-new Date(a.endedAt||a.startedAt||0));
}

function archiveWeekLabel(item){
  if(item.weekKey) return `${item.weekKey.slice(0,4)}년 ${weekLabelOf(item.weekKey)}`;
  const d=new Date(item.endedAt||item.startedAt||Date.now());
  if(isNaN(d))return '날짜 미정';
  
  const day = d.getDay();
  const diffToSunday = d.getDate() - day;
  const sun = new Date(d); sun.setDate(diffToSunday);
  const sat = new Date(sun); sat.setDate(sun.getDate() + 6);
  
  const f = x => `${x.getMonth()+1}.${x.getDate()}(${DOW_KR[x.getDay()]})`;
  return `${d.getFullYear()}년 ${f(sun)}–${f(sat)}`;
}

/* ================= 업무별 코멘트 (점검자 / 담당자) ================= */
const CMT_ROLE_KEY = 'cultureCommentRoleV1';
let taskDetailRef = null;   // { type, id }

function getCommentRole(){
  const r = localStorage.getItem(CMT_ROLE_KEY);
  return (r === 'work' || r === 'check') ? r : 'check';
}
function setCommentRole(role){
  try{ localStorage.setItem(CMT_ROLE_KEY, role); }catch(e){}
  renderTaskDetail();
}

function findTaskItem(type, id){
  const list = meetingState[type] || [];
  return list.find(x => x.id === id) || null;
}

function openTaskDetail(type, id){
  taskDetailRef = { type, id };
  renderTaskDetail();
}
function closeTaskDetail(){
  taskDetailRef = null;
  const h = document.getElementById('taskDetailHost');
  if(h) h.innerHTML = '';
  renderSharedFollowup();
}

function renderTaskDetail(){
  const host = document.getElementById('taskDetailHost');
  if(!host) return;
  if(!taskDetailRef){ host.innerHTML = ''; return; }

  const { type, id } = taskDetailRef;
  const item = findTaskItem(type, id);
  if(!item){ host.innerHTML = ''; taskDetailRef = null; return; }

  const role = getCommentRole();
  const comments = (item.comments || []).slice().sort((a,b)=> new Date(a.at||0) - new Date(b.at||0));

  const thread = comments.length
    ? comments.map(c => {
        const cls = c.role === 'work' ? 'work' : 'check';
        const who = c.role === 'work' ? '담당자' : '점검자';
        const t = c.at ? new Date(c.at) : null;
        const tStr = t && !isNaN(t) ? `${t.getMonth()+1}.${t.getDate()} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}` : '';
        return `<div class="cmt-row ${cls}">
          <span class="cmt-who">${who}</span>
          <div class="cmt-bubble">${escapeHtml(c.text || '')}</div>
          <span class="cmt-time">${tStr} <button class="cmt-del" onclick="deleteTaskComment('${c.id}')">삭제</button></span>
        </div>`;
      }).join('')
    : `<div class="cmt-empty">아직 코멘트가 없습니다.<br>점검자와 담당자가 진행 상황을 주고받으며 기록해보세요.</div>`;

  host.innerHTML = `
    <div class="task-modal-overlay" onclick="if(event.target===this)closeTaskDetail()">
      <div class="task-modal">
        <div class="task-modal-head">
          <div class="task-modal-head-body">
            <h2 class="task-modal-title">${escapeHtml(item.text)}</h2>
            <div class="task-modal-tags">
              <span class="shared-dept-badge" style="--badge-color:var(--dept-${DEPT_COLOR_KEY[item.dept]||'culture'})">${escapeHtml(item.dept)}</span>
              <span class="pf-tag src">${type==='next'?'차주 중점 업무':'지시사항'}</span>
              ${(Number(item.carry)||0)>0?`<span class="pf-tag carry ${Number(item.carry)>=2?'danger':''}">${item.carry}주 이월</span>`:''}
              <span class="pf-tag ${item.done?'':''}">${item.done?'✅ 완료':'🔄 진행 중'}</span>
            </div>
          </div>
          <button class="task-modal-close" onclick="closeTaskDetail()" title="닫기">✕</button>
        </div>

        <div class="cmt-thread" id="cmtThread">${thread}</div>

        <div class="cmt-foot">
          <div class="cmt-role-row">
            <span class="cmt-role-label">작성자</span>
            <button class="cmt-role-btn check ${role==='check'?'on':''}" onclick="setCommentRole('check')">점검자</button>
            <button class="cmt-role-btn work ${role==='work'?'on':''}" onclick="setCommentRole('work')">담당자</button>
          </div>
          <div class="cmt-input-row">
            <textarea class="cmt-input" id="cmtInput" placeholder="진행 상황이나 확인 사항을 남기세요. (Enter 전송 · Shift+Enter 줄바꿈)"></textarea>
            <button class="cmt-send" onclick="addTaskComment()" title="등록">↑</button>
          </div>
          <div class="cmt-status-row">
            <span class="cmt-status-label">업무 상태</span>
            <button class="cmt-role-btn ${item.done?'on work':''}" onclick="toggleTaskDone()">${item.done?'✅ 완료됨 (누르면 해제)':'완료로 표시'}</button>
          </div>
        </div>
      </div>
    </div>`;

  const input = document.getElementById('cmtInput');
  if(input){
    input.onkeydown = (e)=>{
      if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); addTaskComment(); }
    };
    input.focus();
  }
  const thr = document.getElementById('cmtThread');
  if(thr) thr.scrollTop = thr.scrollHeight;
}

function addTaskComment(){
  if(!taskDetailRef) return;
  const input = document.getElementById('cmtInput');
  const text = (input?.value || '').trim();
  if(!text) return;

  const item = findTaskItem(taskDetailRef.type, taskDetailRef.id);
  if(!item) return;
  if(!Array.isArray(item.comments)) item.comments = [];
  item.comments.push({
    id: uid(),
    role: getCommentRole(),
    text,
    at: new Date().toISOString()
  });

  input.value = '';
  saveMeetingState(true);
  renderTaskDetail();
}

function deleteTaskComment(commentId){
  if(!taskDetailRef) return;
  const item = findTaskItem(taskDetailRef.type, taskDetailRef.id);
  if(!item || !Array.isArray(item.comments)) return;
  item.comments = item.comments.filter(c => c.id !== commentId);
  saveMeetingState(true);
  renderTaskDetail();
}

function toggleTaskDone(){
  if(!taskDetailRef) return;
  const item = findTaskItem(taskDetailRef.type, taskDetailRef.id);
  if(!item) return;
  item.done = !item.done;
  item.status = item.done ? '완료' : '대기';
  if(state.data) state.data.sharedMeeting = getSharedMeeting();
  saveMeetingState(true);
  renderTaskDetail();
}

          ${carry>0?`<span class="pf-tag carry ${carry>=2?'danger':''}">${carry}주 이월</span>`:''}
          <span class="cmt-badge ${cmtCount?'':'empty'}">💬 ${cmtCount}</span>
        </span>

function openMeetingArchive(defaultDept){
  const host=document.getElementById('meetingArchiveHost');if(!host)return;
  const selected=(defaultDept&&defaultDept!=='전체 부서')?defaultDept:(state.dept&&state.dept!==ALL_DEPTS?state.dept:'전체 부서');
  host.innerHTML=`<div class="meeting-archive-overlay" onclick="if(event.target===this)closeMeetingArchive()"><div class="meeting-archive-modal"><div class="archive-modal-head"><h2>🗂 지난 회의록</h2><button class="archive-close" onclick="closeMeetingArchive()">✕</button></div><div class="archive-filters"><select class="archive-select" id="archiveDept" onchange="renderMeetingArchiveBody()"><option>전체 부서</option>${DEPTS.map(d=>`<option ${d===selected?'selected':''}>${d}</option>`).join('')}</select><select class="archive-select" id="archiveWeek" onchange="renderMeetingArchiveBody()"></select></div><div class="archive-body" id="archiveBody"></div></div></div>`;
  const archive=getMeetingArchiveData();
  const week=document.getElementById('archiveWeek');
  week.innerHTML=archive.map((x,i)=>`<option value="${i}">${archiveWeekLabel(x)}</option>`).join('')||'<option value="">저장된 회의 없음</option>';
  renderMeetingArchiveBody();
}

function closeMeetingArchive(){const h=document.getElementById('meetingArchiveHost');if(h)h.innerHTML=''}

function renderMeetingArchiveBody(){
  const body=document.getElementById('archiveBody'),week=document.getElementById('archiveWeek'),deptEl=document.getElementById('archiveDept');if(!body||!week||!deptEl)return;
  const archive=getMeetingArchiveData();const item=archive[Number(week.value)||0];
  if(!item){body.innerHTML='<div class="archive-empty">저장된 지난 회의록이 없습니다.</div>';return}
  const dept=deptEl.value;
  const match=x=>x.dept!=='전체' && (dept==='전체 부서'||x.dept===dept);
  const list=(arr,label)=>(Array.isArray(arr)?arr:[]).filter(match).map(x=>`<div class="archive-row ${x.done?'done':''}"><span class="archive-status">${x.done?'✅':'▫️'}</span><span class="archive-row-text">${escapeHtml(x.text||'')}</span><span class="shared-dept-badge" style="--badge-color:var(--dept-${DEPT_COLOR_KEY[x.dept]||'culture'})">${escapeHtml(x.dept||'전체')}</span></div>`).join('')||`<div class="archive-empty">${label}이 없습니다.</div>`;
  const reviewList=(arr)=>(Array.isArray(arr)?arr:[]).filter(match).map(x=>{
    const mark = { '완료':'✅', '진행중':'🔄', '이월':'➡️', '취소':'⛔' }[x.status] || '▫️';
    return `<div class="archive-row"><span class="archive-status">${mark}</span><span class="archive-row-text">${escapeHtml(x.text||'')} · ${escapeHtml(x.status||'대기')}</span><span class="shared-dept-badge" style="--badge-color:var(--dept-${DEPT_COLOR_KEY[x.dept]||'culture'})">${escapeHtml(x.dept||'전체')}</span></div>`;
  }).join('')||'<div class="archive-empty">지시 이행 기록이 없습니다.</div>';
  const dt=new Date(item.endedAt||item.startedAt||Date.now());
  const minutesText = item.minutes || generateMeetingText(item);
  body.innerHTML=`<div class="archive-summary"><b>${escapeHtml(archiveWeekLabel(item))}</b><span>${isNaN(dt)?'':dt.toLocaleString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit'})}</span></div><div class="archive-section"><h3>🔄 지시 이행 결과</h3>${reviewList(item.review)}</div><div class="archive-section"><h3>🚀 차주 할 일</h3>${list(item.next,'차주 할 일')}</div><div class="archive-section"><h3>💡 지시사항 및 피드백</h3>${list(item.decisions,'지시사항 및 피드백')}</div><div class="archive-section"><h3>📝 전체 회의록</h3><div class="archive-minutes">${escapeHtml(minutesText)}</div></div><div class="report-actions"><button class="report-gen-btn" onclick="copyArchiveMinutes()">📋 이 주차 회의록 복사</button></div>`;
  window._archiveCurrentMinutes = minutesText;
}

async function copyArchiveMinutes(){
  try{
    await navigator.clipboard.writeText(window._archiveCurrentMinutes || '');
    showMeetingToast('회의록을 복사했습니다.');
  }catch(e){ showMeetingToast('복사 권한을 확인해주세요.'); }
}

function initModeSwitch(){
  loadMeetingState();
  loadSermonLocal();
  const saved=localStorage.getItem('dashboardViewMode')||'normal';
  document.querySelectorAll('.mode-btn').forEach(b=>b.onclick=()=>setDashboardMode(b.dataset.mode));
  setDashboardMode(saved);
}

document.addEventListener('DOMContentLoaded',initModeSwitch);

// ==================== 메모 기능 ====================

const MEMO_DEPTS = ['전체','문화기획과','영상제작과','사진과','의전과','공연예술과'];
// ★ 메모는 서버(구글시트)와 동기화하지 않는 개인용 기능입니다.
// 이 기기의 브라우저 저장공간(localStorage)에만 남고, 다른 사람이나 다른 기기에서는 보이지 않습니다.
const MEMO_STORAGE_KEY = 'culture_dashboard_personal_memos_v1';

let memos = [];
let currentDetailMemoId = null;
let editingMemoId = null;

// 메모 패널 열기/닫기
function openMemoPanel(){
  document.getElementById('memoPanel').classList.add('open');
  document.getElementById('memoOverlay').classList.add('open');
  loadMemosFromLocal();
  document.getElementById('memoTitleInput').focus();
}

function closeMemoPanel(){
  document.getElementById('memoPanel').classList.remove('open');
  document.getElementById('memoOverlay').classList.remove('open');
}

/* Esc 키로 메모 팝업 닫기 (상세 모달이 열려 있으면 그것부터 닫힘) */
document.addEventListener('keydown', (e)=>{
  if(e.key !== 'Escape') return;
  const detail = document.getElementById('memoModalOverlay');
  if(detail && detail.classList.contains('open')){ closeDetailModal(); return; }
  const panel = document.getElementById('memoPanel');
  if(panel && panel.classList.contains('open')) closeMemoPanel();
});

// 상세보기 모달 열기/닫기
function closeDetailModal(){
  document.getElementById('memoModalOverlay').classList.remove('open');
  currentDetailMemoId = null;
}

function openDetailModal(memo){
  currentDetailMemoId = memo.id;
  document.getElementById('modalTitle').textContent = memo.title || '(제목 없음)';
  document.getElementById('modalContent').textContent = memo.text || '';
  
  const deptKey = getDeptColorKey(memo.dept);
  const metaHtml = `
    <div class="memo-modal-meta-row">
      <span class="memo-dept-badge" style="color:var(--dept-${deptKey});border-color:var(--dept-${deptKey})20;">
        ${escapeHtml(memo.dept)}
      </span>
    </div>
    <div class="memo-modal-meta-row">
      🕐 ${memo.createdAt}
    </div>
    ${memo.updatedAt ? `<div class="memo-modal-meta-row">✏️ 수정 ${memo.updatedAt}</div>` : ''}
  `;
  document.getElementById('modalMeta').innerHTML = metaHtml;
  
  const pinBtn = document.getElementById('modalPinBtn');
  pinBtn.textContent = memo.pinned ? '📌 고정 해제' : '○ 고정';
  
  document.getElementById('memoModalOverlay').classList.add('open');
}

function toggleDetailPin(){
  const memo = memos.find(m => m.id === currentDetailMemoId);
  if(memo){
    memo.pinned = !memo.pinned;
    saveMemosToLocal();
    renderMemos();
    document.getElementById('modalPinBtn').textContent = memo.pinned ? '📌 고정 해제' : '○ 고정';
  }
}

function deleteDetailMemo(){
  if(confirm('이 메모를 삭제하시겠습니까?')){
    const id = currentDetailMemoId;
    memos = memos.filter(m => m.id !== id);
    if(editingMemoId === id) cancelEditMemo();
    saveMemosToLocal();
    closeDetailModal();
    renderMemos();
  }
}

// 이 기기의 localStorage에서 메모 로드
function loadMemosFromLocal(){
  try {
    const raw = localStorage.getItem(MEMO_STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    memos = (Array.isArray(parsed) ? parsed : []).sort((a, b) => {
      if(a.pinned !== b.pinned) return a.pinned ? -1 : 1;
      return new Date(b.createdAt) - new Date(a.createdAt);
    });
    renderMemos();
  } catch(err){
    console.error('Failed to load memos from local storage:', err);
    memos = [];
    renderMemos();
  }
}

// 이 기기의 localStorage에 메모 저장 (서버 동기화 없음 — 개인 전용)
function saveMemosToLocal(){
  try {
    showSyncStatus(true);
    localStorage.setItem(MEMO_STORAGE_KEY, JSON.stringify(memos));
    showSyncStatus(false);
  } catch(err){
    console.error('Failed to save memos to local storage:', err);
    showSyncStatus(false, true);
  }
}

// 저장 상태 표시
function showSyncStatus(saving, failed){
  const indicator = document.getElementById('syncIndicator');
  if(saving){
    indicator.textContent = '⏳ 저장 중...';
    indicator.classList.add('syncing');
  } else if(failed){
    indicator.textContent = '⚠️ 저장 실패';
    indicator.classList.remove('syncing');
  } else {
    indicator.textContent = '✓ 저장됨';
    indicator.classList.remove('syncing');
    setTimeout(() => { indicator.textContent = ''; }, 2000);
  }
}

// 메모 추가
function addMemo(){
  const titleInput = document.getElementById('memoTitleInput');
  const input = document.getElementById('memoInput');
  const title = titleInput.value.trim();
  const text = input.value.trim();

  if(!title){
    titleInput.focus();
    return;
  }

  document.getElementById('addMemoBtn').disabled = true;

  const dept = document.getElementById('memoDeptSelect').value;
  const now = new Date();
  const stamp = now.toLocaleString('ko-KR', {
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit'
  });

  if(editingMemoId !== null){
    /* 수정 모드: 기존 메모 갱신 (id·작성일·고정 상태는 유지) */
    const memo = memos.find(m => m.id === editingMemoId);
    if(memo){
      memo.title = title;
      memo.text = text;
      memo.dept = dept;
      memo.updatedAt = stamp;
    }
    exitEditMode();
  } else {
    memos.unshift({
      id: Date.now() + Math.random(),
      title,
      text,
      dept,
      pinned: false,
      createdAt: stamp
    });
  }

  titleInput.value = '';
  input.value = '';

  saveMemosToLocal();
  renderMemos();

  document.getElementById('addMemoBtn').disabled = false;
  titleInput.focus();
}

/* ---------- 메모 수정 ---------- */
function startEditMemo(id){
  const memo = memos.find(m => m.id === id);
  if(!memo) return;

  editingMemoId = id;
  document.getElementById('memoTitleInput').value = memo.title || '';
  document.getElementById('memoInput').value = memo.text || '';
  document.getElementById('memoDeptSelect').value = memo.dept || '전체';
  document.getElementById('memoPanel').classList.add('editing');
  document.getElementById('addMemoBtn').textContent = '✓';
  document.getElementById('addMemoBtn').title = '수정 저장';

  closeDetailModal();
  renderMemos();
  document.getElementById('memoTitleInput').focus();
}

function exitEditMode(){
  editingMemoId = null;
  const panel = document.getElementById('memoPanel');
  if(panel) panel.classList.remove('editing');
  const btn = document.getElementById('addMemoBtn');
  if(btn){ btn.textContent = '+'; btn.title = '추가'; }
}

function cancelEditMemo(){
  exitEditMode();
  document.getElementById('memoTitleInput').value = '';
  document.getElementById('memoInput').value = '';
  renderMemos();
}

/* 상세 모달에서 바로 수정하기 */
function editDetailMemo(){
  if(currentDetailMemoId === null) return;
  startEditMemo(currentDetailMemoId);
}

// 제목 입력창 Enter → 내용으로 포커스 이동
function handleMemoTitleKeypress(e){
  if(e.key === 'Enter'){
    e.preventDefault();
    document.getElementById('memoInput').focus();
  }
}

// 내용 입력창 Enter 감지 (Shift+Enter는 줄바꿈, Ctrl/Cmd+Enter는 저장)
function handleMemoKeypress(e){
  if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)){
    e.preventDefault();
    addMemo();
  }
}

// 메모 렌더링
function renderMemos(){
  const list = document.getElementById('memoList');
  
  if(memos.length === 0){
    list.innerHTML = '<div class="memo-empty">📭 메모가 없습니다<br>첫 메모를 작성해보세요!</div>';
    return;
  }

  list.innerHTML = memos.map(memo => {
    const deptKey = getDeptColorKey(memo.dept);
    const dateObj = new Date(memo.createdAt);
    const timeStr = dateObj.toLocaleString('ko-KR', {
      month: 'short', day: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });

    return `
      <div class="memo-item ${memo.pinned ? 'pinned' : ''} ${editingMemoId === memo.id ? 'is-editing' : ''}" onclick="openDetailModal(${JSON.stringify(memo).replace(/"/g, '&quot;')})">
        <div class="memo-item-preview">
          <p class="memo-item-title">${escapeHtml(memo.title || '(제목 없음)')}</p>
          ${memo.text ? `<p class="memo-item-text">${escapeHtml(memo.text)}</p>` : ''}
          <div class="memo-item-meta">
            <span class="memo-dept-badge" style="color:var(--dept-${deptKey});border-color:var(--dept-${deptKey})20;">
              ${escapeHtml(memo.dept)}
            </span>
            <span>${timeStr}</span>
            ${memo.updatedAt ? '<span class="memo-edited-mark">· 수정됨</span>' : ''}
          </div>
        </div>
        <div class="memo-item-actions" onclick="event.stopPropagation();">
          <button class="memo-item-btn" onclick="startEditMemo(${memo.id})" title="수정">✏️</button>
          <button class="memo-item-btn" onclick="togglePin(${memo.id})" title="${memo.pinned ? '고정 해제' : '고정'}">${memo.pinned ? '📌' : '○'}</button>
          <button class="memo-item-btn" onclick="deleteMemo(${memo.id})" title="삭제">✕</button>
        </div>
      </div>
    `;
  }).join('');
}

// 부서별 색상 키
function getDeptColorKey(dept){
  const map = {
    '문화기획과': 'culture',
    '영상제작과': 'video',
    '사진과': 'photo',
    '의전과': 'protocol',
    '공연예술과': 'performance',
    '전체': 'etc'
  };
  return map[dept] || 'etc';
}

// 메모 핀 토글
function togglePin(id){
  const memo = memos.find(m => m.id === id);
  if(memo){
    memo.pinned = !memo.pinned;
    saveMemosToLocal();
    renderMemos();
  }
}

// 메모 삭제
function deleteMemo(id){
  if(confirm('이 메모를 삭제하시겠습니까?')){
    memos = memos.filter(m => m.id !== id);
    if(editingMemoId === id) cancelEditMemo();
    saveMemosToLocal();
    renderMemos();
  }
}

// HTML 이스케이프 (기존 함수 있으면 사용, 없으면 정의)
if(typeof escapeHtml !== 'function'){
  window.escapeHtml = function(text){
    const map = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'};
    return String(text).replace(/[&<>"']/g, m => map[m]);
  };
}

load();
setInterval(load, 60000);
</script>
