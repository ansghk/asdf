<title>문화부 대시보드 v3.32</title>
<!-- [v3.30 버그6 수정] http-equiv 캐시 메타태그 제거.
     최신 브라우저는 이 태그를 무시하므로 캐시 무효화 효과가 없고,
     오히려 460KB HTML을 매번 새로 받게 만드는 부작용만 있었습니다.
     실제 캐시 제어는 데이터 fetch의 cache:'no-store' 옵션이 담당합니다. -->

<!-- [v3.31 성능①] 외부 도메인 연결(DNS+TLS)을 미리 열어 첫 요청 대기시간을 줄입니다.
     script.googleusercontent.com 은 Apps Script exec 가 리다이렉트되는 실제 응답 도메인입니다. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">

<!-- [v3.31 성능②] 폰트를 static → variable dynamic-subset 으로 교체 (첫 로딩 최대 개선 항목)
     · 기존 static: 굵기 1종당 약 750KB. 이 대시보드는 300~900 범위의 굵기를 14가지 쓰고 있어
       실제로는 Light/Regular/Medium/SemiBold/Bold/ExtraBold/Black 7개 파일 ≒ 5.2MB 를 받았습니다.
     · variable dynamic-subset: 가변폰트 1벌을 92개 유니코드 조각으로 나눠두고,
       화면에 실제로 쓰인 글자가 든 조각(보통 5~12개 × 약 33KB)만 내려받습니다 ≒ 165~400KB.
     · 덤으로 520/650/750/850/880 같은 중간 굵기가 근사치로 뭉개지지 않고 정확히 렌더링됩니다.
     · 이 CSS 의 모든 @font-face 에는 font-display:swap 이 이미 들어 있어 폰트 대기 중에도
       본문이 먼저 보입니다. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  :root{

    });});(meetingState.review || []).forEach(x => {

  });// 차월계획:현재 남아있는 차주업무 + 이월 항목 (중복 제거)

const DATA_CACHE_KEY = 'cultureDashboardDataCache_v1';

async function loadInner(forceFresh){

        ? '최신 데이터를 불러오지 못했습니다. 저장된 이전 내용을 보고 있습니다.'
        : '최신 데이터를 불러오지 못했습니다. 네트워크 상태를 확인해 주세요.');

  if(state.usingSampleData){                              // 샘플 → 실데이터 복구 시 배지 제거

  // 대부분의 폴링은 "변한 게 없음"이므로 렌더 전체를 건너뛰어
  // 주기적인 화면 버벅임과 스크롤·입력 방해를 없앱니다.
  // ※ 반드시 state.data 에 대입하기 "전에" 비교해야 합니다.

  }

  state.fromCache = false;

    if(state.data && state.data.sharedMeeting) {
      if(state.data.sharedMeeting.decisions) {

      const open=x.kids.filter(k=>k.status!=='완료');m+='\n▸ '+x.title+' ('+kidPct(x.kids)+'%)'+dDay(x.dueDate)+'\n';if(!x.kids.length) m+='   · 세부액션 미등록 — 대시보드에서 배정 필요\n';else if(!open.length) m+='   · 모든 세부액션 완료 🎉\n';else open.forEach(k=>{ m+='   · ['+(k.dept||'미지정')+'] '+k.title+'\n';});});const un=(state.data&&state.data.unreportedDepartments)||[];m+='\n────────────────────\n📋 이번 주 보고:'+(DEPTS.length-un.length)+'/'+DEPTS.length+
       (un.length?'  (미보고:'+un.join(',')+')':'  전 부서 완료 🎉')+'\n';m+='\n※ 보고 시 위 목표명을 「목표:」 줄에 그대로 적어주세요.\n'+
       '   제목에 세부액션명을 적으면 자동으로 완료 처리됩니다.';return m;};window.rpCloseBriefing = function(){ const h=document.getElementById('rpHost');if(h) h.innerHTML='';};window.rpOpenBriefing = function(){
    const text = rpBriefingText();const g = briefingGroups();const openCount = [...g.integrated,...g.external]
      .reduce((a,x)=>a+x.kids.filter(k=>k.status!=='완료').length,0);const monthlyLeft = DEPTS.reduce((a,d)=>a+goalsFor(d)
      .filter(x=>Number(x.current||0)<Number(x.target||1)).length,0);document.getElementById('rpHost').innerHTML =
    `<div class="ops-modal-back" onclick="if(event.target===this)rpCloseBriefing()">

        </div>

          <div class="ops-detail-actions" style="margin-top:14px">
            <button class="ops-btn primary" onclick="rpCopy2(this)">브리핑 텍스트 복사</button>
            <button class="ops-btn" onclick="rpOpenTemplates()">보고 양식 모아보기</button>
            <button class="ops-btn" onclick="rpCloseBriefing()">닫기</button>
          </div>
        </div>
      </div>
    </div>`;};window.rpCopy2 = function(btn){ copyText(rpBriefingText(),btn);};window.rpOpenTemplates = function(){
    const g = briefingGroups();const rows = [];[...g.integrated.map(x=>({...x,tag:'통합목표'})),...g.external.map(x=>({...x,tag:'외부지시'}))].forEach(goal=>{
      goal.kids.filter(k=>k.status!=='완료').forEach(k=>{
        rows.push({dept:k.dept||'',tag:goal.tag,goal:goal.title,action:k.title});});});DEPTS.forEach(d=>{
      goalsFor(d).filter(x=>Number(x.current||0)<Number(x.target||1)).forEach(x=>{
        rows.push({dept:d,tag:'월간목표',goal:x.title,action:'',note:(x.current||0)+'/'+x.target+' '+(x.unit||'건')});});});const body = rows.length ? DEPTS.map(dept=>{
      const mine = rows.filter(r=>!r.dept || r.dept===dept);if(!mine.length) return '';return `<div style="margin-bottom:14px">

          </div>
          <button class="rp-btn" onclick="rpCopy('${esc(dept)}','${esc(r.goal).replace(/'/g,'&#39;')}','${esc(r.action).replace(/'/g,'&#39;')}',this)">양식 복사</button>
        </div>`).join('')}

    `<div class="ops-modal-back" onclick="if(event.target===this)rpCloseBriefing()">
      <div class="ops-modal" style="width:min(760px,100%)">

    const item = managedOps().find(x=>String(x.id)===String(id));if(!item) return;const kids = childOps(id);const rows = document.querySelectorAll('#opsManageHost .ops-child-list .ops-child-row');rows.forEach((row,i)=>{

  function injectGoalButtons(){
    document.querySelectorAll('.dept-goal-row').forEach(row=>{
      const dept = (row.querySelector('.dept-goal-name')||{}).textContent||'';row.querySelectorAll('.dept-goal-item').forEach(item=>{
        if(item.querySelector('.rp-btn')) return;const head = item.querySelector('.dept-goal-item-head');const title = (item.querySelector('.dept-goal-item-title')||{}).textContent||'';if(!head || !title) return;const b=document.createElement('button');b.className='rp-btn';b.textContent='보고양식';b.onclick = ev => { ev.stopPropagation();rpCopy(dept.trim(),title.trim(),title.trim(),b);};head.appendChild(b);});});}
  function wrap(name,after){
    const orig = window[name];if(typeof orig !== 'function') return;window[name] = function(){

      return r;};}
  wrap('openOpsDetail',function(id){ setTimeout(()=>injectDetailButtons(id),0);});wrap('renderOpsOverview',function(){ setTimeout(injectGoalButtons,0);});wrap('renderDeptModal',function(){ setTimeout(injectGoalButtons,0);});document.addEventListener('DOMContentLoaded',mount);if(document.readyState!=='loading') mount();function mount(){
    if(document.getElementById('rpFab')) return;const b=document.createElement('button');b.id='rpFab';b.className='rp-fab';b.innerHTML='🌅 <span>브리핑 / 보고양식</span>';b.onclick=()=>rpOpenBriefing();document.body.appendChild(b);setTimeout(injectGoalButtons,1200);}

// [v3.30 버그5 수정] 기존에는 "준비 중입니다" alert 만 띄우는 미구현 함수였습니다.
// 과별 월간목표는 실제로는 ops 항목(type='monthly' + dept)이므로,
// 새 모달을 만들 필요 없이 이미 완성되어 있는 운영업무 상세 모달을 재사용합니다.
// 그 모달 안에서 제목·설명·마감일 수정, 세부업무 추가/편집/삭제, 완료·보관·삭제가 모두 가능합니다.
function editGoal(dept,goalId,goalTitle){
  const id = String(goalId||'');
  let item = id ? managedOps().find(x=>String(x.id)===id) : null;
  // id 가 없거나 못 찾으면 과 + 제목으로 다시 찾아봅니다.
  if(!item && (dept||goalTitle)){
    item = managedOps().find(x=>x.type==='monthly' && x.dept===dept && x.title===goalTitle);}
  if(item){ openOpsDetail(item.id);return;}
  // 그래도 못 찾으면 해당 과의 목표 관리 화면으로 보냅니다.
  if(dept && typeof openDeptGoalManager==='function'){ openDeptGoalManager(dept);return;}
  alert('목표를 찾지 못했습니다. 새로고침 후 다시 시도해 주세요.');}
// [v3.30 버그4 수정] 현재 인라인 편집 중인 건의사항 카드의 인덱스 (null = 편집 중 아님)
let mwEditingSuggestionIdx = null;
function mwSuggestionsData(){
  if(!meetingState.suggestions) meetingState.suggestions={suggestions:[]};return meetingState.suggestions;}
function mwSuggestionsSection(suggestions,categoryLabels){
  if(!suggestions.length) return '<div class="mw-empty">아직 건의사항이 없습니다.</div>';return suggestions.map((s,idx)=>{
    // [v3.30 버그4 수정] 편집 모드일 때는 제목·분류·제안자·내용을 실제 입력창으로 바꿉니다.
    const editing = (mwEditingSuggestionIdx === idx);
    const header = editing ? `
        <div style="flex:1;display:grid;gap:7px">
          <select class="mw-input" style="font-size:11px" onchange="mwUpdateSuggestion(${idx},'category',this.value)">
            ${Object.keys(categoryLabels).map(k=>`<option value="${k}" ${(s.category||'content')===k?'selected':''}>${categoryLabels[k]}</option>`).join('')}
          </select>
          <input class="mw-input" style="font-size:12.5px;font-weight:700" value="${mwEsc(s.title)}"
                 placeholder="건의 제목" onchange="mwUpdateSuggestion(${idx},'title',this.value)">
          <input class="mw-input" style="font-size:11px" value="${mwEsc(s.proposer)}"
                 placeholder="제안자" onchange="mwUpdateSuggestion(${idx},'proposer',this.value)">
        </div>` : `
        <div style="flex:1">
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
            <span class="mw-category-badge" style="background:var(--category-${s.category||'content'})">
              ${categoryLabels[s.category||'content']||'건의'}
            </span>
            <span style="font-size:9px;color:var(--text-dim)">${s.proposalDate||'날짜 미정'}</span>
          </div>
          <div style="font-weight:700;font-size:13.5px;margin-bottom:6px">${mwEsc(s.title)}</div>
          <div style="color:var(--text-muted);font-size:10.5px">제안자:${mwEsc(s.proposer)}</div>
        </div>`;
    const descBlock = editing ? `
          <textarea class="mw-input" style="min-height:70px;font-size:11.5px" placeholder="건의 내용"
            onchange="mwUpdateSuggestion(${idx},'description',this.value)">${mwEsc(s.description)}</textarea>`
      : `<div style="padding:8px;background:rgba(var(--ink-rgb),.035);border-radius:8px;border-left:3px solid var(--category-${s.category||'content'});font-size:11.5px;line-height:1.5">${mwEsc(s.description)}</div>`;
    return `
    <div class="mw-suggestion-card${editing?' is-editing':''}">
      <div class="mw-suggestion-header">
        ${header}
        <div style="display:flex;gap:4px">
          <button class="mw-mini${editing?' primary':''}" onclick="mwEditSuggestion(${idx})">${editing?'완료':'편집'}</button>
          <button class="mw-mini ops-mini-delete" onclick="mwDeleteSuggestion(${idx})">삭제</button>
        </div>
      </div>
      <div class="mw-suggestion-content" style="margin-top:10px">
        <div style="margin-bottom:8px">
          <div style="font-size:10px;color:var(--text-dim);margin-bottom:3px">건의 내용</div>
          ${descBlock}
        </div>
        <div style="margin-top:8px">
          <div style="font-size:10px;color:var(--text-dim);margin-bottom:3px">담당자</div>
          <input class="mw-input" style="font-size:11px" placeholder="담당자 선택" value="${mwEsc(s.assignee)}" onchange="mwUpdateSuggestion(${idx},'assignee',this.value)">

          <textarea class="mw-input" style="min-height:60px;font-size:11px" placeholder="예상 효과,기대 효과 등을 입력하세요" onchange="mwUpdateSuggestion(${idx},'expectedEffect',this.value)">${mwEsc(s.expectedEffect)}</textarea>

        <div style="margin-top:8px">

          <input class="mw-input" style="font-size:11px" placeholder="예:5,000만원 / 검토 필요" value="${mwEsc(s.estimatedCost)}" onchange="mwUpdateSuggestion(${idx},'estimatedCost',this.value)">
        </div>
        <div style="margin-top:8px">
          <div style="font-size:10px;color:var(--text-dim);margin-bottom:3px">담당자 피드백</div>
          <textarea class="mw-input" style="min-height:60px;font-size:11px" placeholder="검토 후 피드백을 입력하세요" onchange="mwUpdateSuggestion(${idx},'feedback',this.value)">${mwEsc(s.feedback)}</textarea>
        </div>
      </div>
    </div>
  `;}).join('');}
function mwAddSuggestionForm(){
  return `
    <div style="display:grid;gap:10px">
      <div>
        <label style="display:block;font-size:10px;color:var(--text-dim);margin-bottom:4px">분류</label>
        <select class="mw-input" id="mw-new-category" style="font-size:11px">
          <option value="content">🎬 콘텐츠 개발</option>
          <option value="process">⚙️ 프로세스 개선</option>
          <option value="budget">💰 예산/비용</option>
          <option value="equipment">🔧 장비/기술</option>
          <option value="people">👥 인력/조직</option>
        </select>
      </div>
      <div>
        <label style="display:block;font-size:10px;color:var(--text-dim);margin-bottom:4px">건의 제목</label>
        <input class="mw-input" id="mw-new-title" placeholder="간단한 제목을 입력하세요" style="font-size:11px">
      </div>
      <div>
        <label style="display:block;font-size:10px;color:var(--text-dim);margin-bottom:4px">건의 내용</label>
        <textarea class="mw-input" id="mw-new-description" placeholder="자세한 건의 내용을 입력하세요" style="min-height:80px;font-size:11px"></textarea>
      </div>
      <div>
        <label style="display:block;font-size:10px;color:var(--text-dim);margin-bottom:4px">제안자</label>
        <input class="mw-input" id="mw-new-proposer" placeholder="이름을 입력하세요" style="font-size:11px">
      </div>
      <button class="mw-btn primary" onclick="mwAddNewSuggestion()" style="margin-top:8px">+ 건의사항 추가</button>
    </div>
  `;}
function mwAddNewSuggestion(){
  const title=(document.getElementById('mw-new-title')?.value||'').trim();const desc=(document.getElementById('mw-new-description')?.value||'').trim();const cat=document.getElementById('mw-new-category')?.value||'content';const proposer=(document.getElementById('mw-new-proposer')?.value||'').trim();if(!title||!desc||!proposer){alert('제목,내용,제안자를 모두 입력해주세요');return;}
  const d=mwSuggestionsData();d.suggestions=[...(d.suggestions||[]),{id:uid(),title,description:desc,category:cat,proposer,proposalDate:todayStr(),assignee:'',reviewDate:'',expectedEffect:'',estimatedCost:'',feedback:'',decision:''}];mwSuggestionsDataSave();renderMeetingMode();}
function mwUpdateSuggestion(idx,field,value){
  const d=mwSuggestionsData();if(d.suggestions[idx]) d.suggestions[idx][field]=value;mwSuggestionsDataSave();}
function mwDeleteSuggestion(idx){
  if(!confirm('이 건의사항을 삭제하시겠습니까?')) return;const d=mwSuggestionsData();d.suggestions.splice(idx,1);
  // [v3.30 버그4 수정] 삭제로 인덱스가 밀리면 엉뚱한 카드가 편집 상태로 열리므로 정리합니다.
  if(mwEditingSuggestionIdx === idx) mwEditingSuggestionIdx = null;
  else if(mwEditingSuggestionIdx !== null && mwEditingSuggestionIdx > idx) mwEditingSuggestionIdx--;
  mwSuggestionsDataSave();renderMeetingMode();}
function mwSuggestionsDataSave(){
  meetingState.suggestions=mwSuggestionsData();try{localStorage.setItem('cultureMeetingState'+meetingState.weekKey,JSON.stringify(meetingState))}catch(e){}
}
function todayStr(){
  const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1).toString().padStart(2,'0')+'-'+d.getDate().toString().padStart(2,'0');}
// [v3.30 버그4 수정] 기존에는 console.log 만 찍고 끝나 "눌러도 아무 일도 없는 죽은 버튼"이었습니다.
// 이제 해당 카드의 제목·분류·제안자·내용을 입력창으로 전환하고, 다시 누르면 편집을 마칩니다.
// (담당자/예상효과/비용/피드백은 원래부터 상시 편집 가능하므로 그대로 둡니다)
function mwEditSuggestion(idx){
  mwEditingSuggestionIdx = (mwEditingSuggestionIdx === idx) ? null : idx;
  renderMeetingMode();}
</script>
