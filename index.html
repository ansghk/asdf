<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>문화부 대시보드</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
  :root{
    /* Apple Dark Mode palette */
    --bg:#050507;
    --text:#F5F5F7;
    --text-muted:#98989F;
    --text-dim:#636369;
    --blue:#0A84FF;
    --radius:20px;

    /* Liquid glass surfaces */
    --glass:rgba(255,255,255,0.055);
    --glass-strong:rgba(255,255,255,0.09);
    --glass-border:rgba(255,255,255,0.10);
    --glass-border-strong:rgba(255,255,255,0.18);
    --glass-shadow:0 8px 32px rgba(0,0,0,0.38);

    /* Apple system colors (dark) per department */
    --dept-culture:#FF9F0A;      /* orange */
    --dept-video:#64D2FF;        /* cyan */
    --dept-photo:#BF5AF2;        /* purple */
    --dept-protocol:#30D158;     /* green */
    --dept-performance:#FF453A;  /* red */
    --dept-etc:#AC8E68;

    /* 구조색(트랙/헤어라인/칩 배경 등) 테마 반전용 — 다크: 흰색, 라이트: 검정색 */
    --ink-rgb:255,255,255;
  }

  body.light{
    --bg:#F2F2F7;
    --text:#1D1D1F;
    --text-muted:#6E6E73;
    --text-dim:#98989D;
    --blue:#007AFF;
    --glass:rgba(255,255,255,0.78);
    --glass-strong:rgba(255,255,255,0.95);
    --glass-border:rgba(0,0,0,0.07);
    --glass-border-strong:rgba(0,0,0,0.16);
    --glass-shadow:0 8px 28px rgba(0,0,0,0.07);
    --dept-culture:#FF9500;
    --dept-video:#0A84FF;
    --dept-photo:#AF52DE;
    --dept-protocol:#34C759;
    --dept-performance:#FF3B30;
    --dept-etc:#A2845E;
    --ink-rgb:0,0,0;
  }
  body.light::before{
    background:
      radial-gradient(600px 420px at 15% -5%, rgba(255,149,0,0.10), transparent 65%),
      radial-gradient(560px 460px at 100% 12%, rgba(0,122,255,0.08), transparent 65%),
      radial-gradient(680px 560px at 50% 110%, rgba(175,82,222,0.06), transparent 70%);
  }
  body.light header{
    background:rgba(242,242,247,0.75);
    border-bottom:1px solid rgba(0,0,0,0.06);
  }
  body.light .dept-card{
    background:rgba(255,255,255,0.85);
    border-color:rgba(0,0,0,0.06);
    box-shadow:0 4px 20px rgba(0,0,0,0.06);
  }
  body.light .dept-card.active{
    background:color-mix(in srgb, var(--dept-color,var(--blue)) 5%, #FFFFFF);
    border-color:color-mix(in srgb, var(--dept-color,var(--blue)) 85%, transparent);
    box-shadow:
      0 0 0 3px color-mix(in srgb, var(--dept-color,var(--blue)) 16%, transparent),
      0 10px 32px color-mix(in srgb, var(--dept-color,var(--blue)) 30%, transparent),
      0 2px 10px rgba(0,0,0,0.05);
  }

  .meta-right{display:flex;align-items:center;gap:12px;}
  .theme-toggle{
    display:flex;gap:2px;padding:2px;border-radius:100px;
    background:var(--glass);border:1px solid var(--glass-border);
    -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
  }
  .theme-opt{
    padding:4px 10px;border-radius:100px;
    font-size:10.5px;font-weight:600;color:var(--text-muted);
    display:flex;align-items:center;gap:3px;white-space:nowrap;
    transition:background .15s,color .15s;
  }
  .theme-opt.active{background:rgba(255,255,255,0.16);color:var(--text);}
  body.light .theme-toggle{background:rgba(0,0,0,0.05);border-color:rgba(0,0,0,0.06);}
  body.light .theme-opt.active{background:#FFFFFF;box-shadow:0 1px 6px rgba(0,0,0,0.12);}

  /* 메모 버튼 스타일 */
  .memo-btn{
    width:36px;height:36px;border-radius:100px;
    display:flex;align-items:center;justify-content:center;
    background:var(--glass);border:1px solid var(--glass-border);
    font-size:18px;cursor:pointer;
    -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
    transition:background .15s, transform .1s;
  }
  .memo-btn:active{transform:scale(.94);}
  .memo-btn:hover{background:var(--glass-strong);}
  body.light .memo-btn{background:rgba(0,0,0,0.05);border-color:rgba(0,0,0,0.06);}

  /* 메모 패널 스타일 (중앙 팝업) */
  .memo-panel{
    position:fixed;left:50%;top:50%;
    width:min(880px, 94vw);height:min(82vh, 820px);
    background:rgba(5,5,7,0.86);
    -webkit-backdrop-filter:blur(28px) saturate(180%);
    backdrop-filter:blur(28px) saturate(180%);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:24px;
    box-shadow:0 28px 80px rgba(0,0,0,0.55);
    z-index:25;
    display:flex;flex-direction:column;
    transform:translate(-50%, -46%) scale(0.97);
    opacity:0;pointer-events:none;
    transition:transform .25s cubic-bezier(0.4, 0, 0.2, 1), opacity .25s ease;
    overflow:hidden;
  }
  .memo-panel.open{transform:translate(-50%, -50%) scale(1);opacity:1;pointer-events:all;}
  body.light .memo-panel{background:rgba(242,242,247,0.95);border-color:rgba(0,0,0,0.08);}

  .memo-overlay{
    position:fixed;inset:0;z-index:24;
    background:rgba(0,0,0,0.55);
    -webkit-backdrop-filter:blur(5px);
    backdrop-filter:blur(5px);
    opacity:0;pointer-events:none;
    transition:opacity .25s;
  }
  .memo-overlay.open{opacity:1;pointer-events:all;}

  .memo-header{
    flex:0 0 auto;padding:16px 20px;
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid rgba(255,255,255,0.06);gap:10px;
  }
  body.light .memo-header{border-bottom-color:rgba(0,0,0,0.06);}

  .memo-title{font-size:16px;font-weight:700;margin:0;}
  .memo-sync-indicator{font-size:10px;color:var(--text-muted);margin-left:8px;}
  .memo-sync-indicator.syncing{color:#30D158;font-weight:600;}
  .memo-subtitle{font-size:10.5px;color:var(--text-dim);margin:3px 0 0;font-weight:500;}

  .memo-close-btn{
    width:32px;height:32px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    background:transparent;font-size:20px;
    transition:background .15s;flex:0 0 auto;
  }
  .memo-close-btn:hover{background:rgba(255,255,255,0.08);}
  body.light .memo-close-btn:hover{background:rgba(0,0,0,0.06);}

  .memo-input-group{
    flex:0 0 auto;padding:16px 16px 12px;
    display:flex;flex-direction:column;gap:10px;
  }

  .memo-input-row{display:flex;gap:8px;align-items:stretch;}

  .memo-text-input{
    flex:1;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);
    border-radius:12px;padding:10px 14px;color:var(--text);font-family:inherit;
    font-size:14px;-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
    transition:background .15s, border-color .15s;
  }
  .memo-text-input:focus{
    outline:none;background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.20);
  }
  .memo-text-input::placeholder{color:var(--text-muted);}
  body.light .memo-text-input{background:rgba(0,0,0,0.05);border-color:rgba(0,0,0,0.08);}
  body.light .memo-text-input:focus{background:rgba(0,0,0,0.08);border-color:rgba(0,0,0,0.15);}

  .memo-title-input{
    width:100%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);
    border-radius:12px;padding:10px 14px;color:var(--text);font-family:inherit;
    font-size:14px;font-weight:700;-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
    transition:background .15s, border-color .15s;box-sizing:border-box;
  }
  .memo-title-input:focus{
    outline:none;background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.20);
  }
  .memo-title-input::placeholder{color:var(--text-muted);font-weight:400;}
  body.light .memo-title-input{background:rgba(0,0,0,0.05);border-color:rgba(0,0,0,0.08);}
  body.light .memo-title-input:focus{background:rgba(0,0,0,0.08);border-color:rgba(0,0,0,0.15);}

  .memo-content-input{
    width:100%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);
    border-radius:12px;padding:10px 14px;color:var(--text);font-family:inherit;
    font-size:13.5px;line-height:1.5;-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
    transition:background .15s, border-color .15s;box-sizing:border-box;
    resize:vertical;min-height:64px;max-height:200px;
  }
  .memo-content-input:focus{
    outline:none;background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.20);
  }
  .memo-content-input::placeholder{color:var(--text-muted);}
  body.light .memo-content-input{background:rgba(0,0,0,0.05);border-color:rgba(0,0,0,0.08);}
  body.light .memo-content-input:focus{background:rgba(0,0,0,0.08);border-color:rgba(0,0,0,0.15);}

  .memo-add-btn{
    flex:0 0 auto;width:40px;height:40px;border-radius:12px;
    background:var(--blue);border:none;display:flex;align-items:center;justify-content:center;
    color:white;font-size:18px;cursor:pointer;transition:transform .1s, opacity .15s;
  }
  .memo-add-btn:active{transform:scale(.95);}
  .memo-add-btn:disabled{opacity:.5;cursor:not-allowed;}

  .memo-dept-row{display:flex;gap:8px;align-items:center;}
  .memo-dept-label{font-size:12px;color:var(--text-muted);font-weight:600;flex:0 0 auto;}

  .memo-dept-select{
    flex:1;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);
    border-radius:12px;padding:8px 12px;color:var(--text);font-family:inherit;
    font-size:13px;-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
    transition:background .15s, border-color .15s;
  }
  .memo-dept-select:focus{
    outline:none;background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.20);
  }
  body.light .memo-dept-select{background:rgba(0,0,0,0.05);border-color:rgba(0,0,0,0.08);}
  body.light .memo-dept-select:focus{background:rgba(0,0,0,0.08);border-color:rgba(0,0,0,0.15);}

  .memo-list{
    flex:1;overflow-y:auto;padding:8px 16px 16px;
    display:flex;flex-direction:column;gap:8px;
  }

  /* 데스크탑: 좌(메모 목록) / 우(작성 영역, 크게) 2단 구성 */
  .memo-body-split{
    flex:1;min-height:0;display:flex;flex-direction:column;
  }
  @media (min-width:820px){
    .memo-body-split{flex-direction:row;}

    /* 왼쪽: 작성된 메모가 아래로 쌓이는 목록 */
    .memo-body-split .memo-list{
      order:1;flex:0 0 300px;min-width:0;
      border-right:1px solid rgba(255,255,255,0.06);
      padding:14px;
    }
    body.light .memo-body-split .memo-list{border-right-color:rgba(0,0,0,0.06);}

    /* 오른쪽: 넓게 쓰는 작성 영역 */
    .memo-body-split .memo-input-group{
      order:2;flex:1;min-width:0;padding:18px 20px;
      display:flex;flex-direction:column;gap:12px;
    }
    .memo-body-split .memo-content-input{
      flex:1;min-height:220px;max-height:none;font-size:14.5px;line-height:1.6;
      padding:14px 16px;resize:none;
    }
    .memo-body-split .memo-title-input{font-size:15.5px;padding:12px 16px;}
    .memo-body-split .memo-dept-row{flex:0 0 auto;}
  }

  /* 모바일: 메모 목록 줄임, 작성란 크게 */
  @media (max-width:819px){
    .memo-body-split .memo-list{
      order:2;flex:0 0 auto;max-height:180px;overflow-y:auto;
      border-bottom:1px solid rgba(255,255,255,0.06);
      padding:10px 14px;margin-top:8px;
    }
    body.light .memo-body-split .memo-list{border-bottom-color:rgba(0,0,0,0.06);}
    
    .memo-body-split .memo-input-group{
      order:1;flex:0 0 auto;padding:14px 16px 8px;
    }
    .memo-body-split .memo-content-input{
      height:280px;font-size:14px;line-height:1.5;
      padding:12px 14px;resize:none;
    }
    .memo-body-split .memo-title-input{font-size:14px;padding:10px 14px;}
  }

  .memo-item{
    background:rgba(255,255,255,0.055);border:1px solid rgba(255,255,255,0.08);
    border-radius:14px;padding:12px 14px;-webkit-backdrop-filter:blur(24px);
    backdrop-filter:blur(24px);display:flex;flex-direction:column;gap:8px;
    transition:background .15s, border-color .15s, transform .1s;
    animation:slideIn .3s ease-out;cursor:pointer;
  }
  @keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .memo-item:hover{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.12);}
  .memo-item.pinned{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.14);order:-1;}
  body.light .memo-item{background:rgba(0,0,0,0.04);border-color:rgba(0,0,0,0.08);}
  body.light .memo-item:hover{background:rgba(0,0,0,0.08);border-color:rgba(0,0,0,0.12);}
  body.light .memo-item.pinned{background:rgba(0,0,0,0.08);border-color:rgba(0,0,0,0.14);}

  .memo-item-preview{flex:1;min-width:0;}
  .memo-item-title{
    font-size:14px;font-weight:700;line-height:1.4;color:var(--text);word-break:break-word;margin:0 0 4px;
    overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;
    -webkit-box-orient:vertical;
  }
  .memo-item-text{
    font-size:13px;line-height:1.4;color:var(--text-muted);word-break:break-word;margin:0;
    overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;
  }

  .memo-item-meta{
    display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11px;
    color:var(--text-muted);flex-wrap:wrap;
  }

  .memo-dept-badge{
    display:inline-block;padding:3px 8px;border-radius:6px;
    background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);
    font-size:10px;font-weight:600;
  }
  body.light .memo-dept-badge{background:rgba(0,0,0,0.05);border-color:rgba(0,0,0,0.08);}

  .memo-item-actions{display:flex;gap:4px;flex:0 0 auto;}

  /* 메모 수정 모드 */
  .memo-edit-banner{
    display:none;align-items:center;justify-content:space-between;gap:8px;
    padding:9px 13px;border-radius:11px;
    background:rgba(255,159,10,0.14);border:1px solid rgba(255,159,10,0.35);
    color:#FF9F0A;font-size:11.5px;font-weight:700;
  }
  .memo-panel.editing .memo-edit-banner{display:flex;}
  .memo-edit-cancel{
    padding:4px 10px;border-radius:8px;background:rgba(255,159,10,0.2);
    border:1px solid rgba(255,159,10,0.4);color:#FF9F0A;font-size:10.5px;font-weight:800;
  }
  .memo-edit-cancel:hover{background:rgba(255,159,10,0.32);}
  .memo-panel.editing .memo-add-btn{background:#FF9F0A;}
  .memo-item.is-editing{border-color:rgba(255,159,10,0.5);background:rgba(255,159,10,0.07);}
  .memo-edited-mark{color:var(--text-dim);font-size:9.5px;}

  .memo-item-btn{
    width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,0.08);
    border:none;display:flex;align-items:center;justify-content:center;
    color:var(--text-muted);font-size:14px;cursor:pointer;
    transition:background .15s, color .15s;flex:0 0 auto;
  }
  .memo-item-btn:hover{background:rgba(255,255,255,0.14);color:var(--text);}
  body.light .memo-item-btn{background:rgba(0,0,0,0.05);}
  body.light .memo-item-btn:hover{background:rgba(0,0,0,0.12);}

  .memo-empty{
    flex:1;display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);font-size:14px;text-align:center;padding:40px 20px;
  }

  .memo-list::-webkit-scrollbar{width:6px;}
  .memo-list::-webkit-scrollbar-track{background:transparent;}
  .memo-list::-webkit-scrollbar-thumb{background:rgba(var(--ink-rgb),0.1);border-radius:3px;}
  .memo-list::-webkit-scrollbar-thumb:hover{background:rgba(var(--ink-rgb),0.2);}

  /* 상세보기 모달 */
  .memo-modal-overlay{
    position:fixed;inset:0;z-index:26;background:rgba(0,0,0,0.4);
    opacity:0;pointer-events:none;transition:opacity .3s;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .memo-modal-overlay.open{opacity:1;pointer-events:all;}

  .memo-modal{
    background:rgba(5,5,7,0.95);-webkit-backdrop-filter:blur(28px) saturate(180%);
    backdrop-filter:blur(28px) saturate(180%);border:1px solid rgba(255,255,255,0.06);
    border-radius:24px;max-width:500px;width:100%;max-height:80vh;
    display:flex;flex-direction:column;
    transform:scale(0.9);opacity:0;transition:transform .3s, opacity .3s;
    animation:modalIn .3s ease-out forwards;
  }
  @keyframes modalIn{to{transform:scale(1);opacity:1}}
  body.light .memo-modal{background:rgba(242,242,247,0.95);border-color:rgba(0,0,0,0.06);}

  .memo-modal-header{
    flex:0 0 auto;padding:24px 24px 16px;
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  body.light .memo-modal-header{border-bottom-color:rgba(0,0,0,0.06);}

  .memo-modal-title{font-size:18px;font-weight:700;margin:0;}

  .memo-modal-close{
    width:36px;height:36px;border-radius:8px;background:transparent;
    font-size:20px;display:flex;align-items:center;justify-content:center;
    transition:background .15s;
  }
  .memo-modal-close:hover{background:rgba(255,255,255,0.08);}
  body.light .memo-modal-close:hover{background:rgba(0,0,0,0.06);}

  .memo-modal-body{
    flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px;
  }

  .memo-modal-content{
    background:rgba(255,255,255,0.055);border:1px solid rgba(255,255,255,0.08);
    border-radius:14px;padding:16px;-webkit-backdrop-filter:blur(24px);
    backdrop-filter:blur(24px);line-height:1.6;color:var(--text);
    word-break:break-word;white-space:pre-wrap;
  }
  body.light .memo-modal-content{background:rgba(0,0,0,0.04);border-color:rgba(0,0,0,0.08);}

  .memo-modal-detail-title{
    font-size:16px;font-weight:700;color:var(--text);margin:0 0 10px;
    word-break:break-word;white-space:pre-wrap;
  }

  .memo-modal-meta{display:flex;flex-direction:column;gap:10px;}

  .memo-modal-meta-row{
    display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-muted);
  }

  .memo-modal-actions{
    flex:0 0 auto;display:flex;gap:8px;padding:16px 24px;
    border-top:1px solid rgba(255,255,255,0.06);
  }
  body.light .memo-modal-actions{border-top-color:rgba(0,0,0,0.06);}

  .memo-modal-btn{
    flex:1;padding:10px 16px;border-radius:12px;border:none;
    font-size:14px;font-weight:600;cursor:pointer;
    transition:background .15s, transform .1s;
  }
  .memo-modal-btn:active{transform:scale(.98);}

  .memo-modal-pin-btn{
    background:rgba(255,255,255,0.08);color:var(--text);
  }
  .memo-modal-pin-btn:hover{background:rgba(255,255,255,0.14);}
  body.light .memo-modal-pin-btn{background:rgba(0,0,0,0.05);}

    width:10px;height:10px;border-radius:50%;flex:0 0 auto;

  .schedule-info{flex:1;min-width:0;}
  .schedule-title{font-size:13.5px;font-weight:700;color:var(--text);margin:0 0 2px;}
  .schedule-meta{font-size:11px;color:var(--text-muted);margin:0 0 4px;line-height:1.4;}
  .schedule-dept-tag{
    display:block;
    font-size:11px;
    font-weight:500;
    color:var(--text-dim);
    text-align:right;
    margin-top:2px;
  }

  .report-cal{
    margin:16px 18px 0;padding:18px 16px 16px;
    background:var(--glass);border:1px solid var(--glass-border);
    border-radius:var(--radius);box-shadow:var(--glass-shadow);
  }
  .report-cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
  .report-cal-title{font-size:14px;font-weight:700;}
  .report-cal-month{font-size:11px;color:var(--text-dim);font-weight:600;}
  .report-summary-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px;}
  .report-chip{
    display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;
    padding:4px 9px;border-radius:100px;background:rgba(var(--ink-rgb),0.06);border:1px solid rgba(var(--ink-rgb),0.09);
    color:var(--text-muted);
  }
  .report-chip .chip-dot{width:5px;height:5px;border-radius:50%;background:var(--chip-color,var(--blue));}

  .queue-card{
    background:var(--glass);border:1px solid var(--glass-border);
    border-radius:var(--radius);padding:4px 0;margin-bottom:12px;
  }
  .queue-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid rgba(var(--ink-rgb),0.06);}
  .queue-row:first-child{border-top:none;}
  .queue-left{display:flex;flex-direction:column;gap:2px;}
  .queue-title{font-size:13.5px;font-weight:600;}
  .queue-type{font-size:11px;color:var(--text-dim);}
  .badge{
    font-size:11px;font-weight:600;padding:5px 10px;border-radius:100px;
    background:rgba(10,132,255,0.16);color:#6CB8FF;border:1px solid rgba(10,132,255,0.25);
  }
  .badge.ready{background:rgba(48,209,88,0.14);color:#5CE07F;border-color:rgba(48,209,88,0.25);}

  /* ★ 상단 브리핑 영역 ★ */
  .briefing{
    display:grid;
    grid-template-columns: 2fr 1.15fr;
    gap: 16px;
    padding: 16px 18px 0;
  }

  .briefing-card{
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:var(--radius);
    padding:22px 24px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    position:relative;
    overflow:hidden;
    box-shadow:var(--glass-shadow);
  }

  /* 좌측 주간 보고 카드 스타일 */
  .briefing-card.report-main-card{
    min-height: 220px;
  }
  .briefing-card-top-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    width:100%;
    z-index:2;
  }
  .briefing-card-text-group{
    display:flex;
    flex-direction:column;
    gap:4px;
    max-width: 65%;
  }
  .briefing-eyebrow{
    font-size:12px;
    font-weight:700;
    color:#FF9F0A;
    letter-spacing:-0.01em;
    margin:0 0 2px;
  }
  .briefing-big-title{
    font-size:24px;
    font-weight:800;
    line-height:1.3;
    margin:0 0 6px;
    color:var(--text);
    letter-spacing:-0.03em;
  }
  .briefing-sub-desc{
    font-size:12.5px;
    color:var(--text-muted);
    margin:0;
    line-height:1.4;
  }

  /* 우측 원형 차트 그래픽 */
  .briefing-chart-pos{
    position:absolute;
    right: 20px;
    top:50%;
    transform:translateY(-50%);
    z-index:1;
  }
  .briefing-chart-pos .ring-wrap{
    width:120px;
    height:120px;
  }
  .briefing-chart-pos .ring-wrap svg{
    width:100%;
    height:100%;
  }
  .briefing-chart-pos .ring-track{
    stroke-width:10;
  }
  .briefing-chart-pos .ring-fill{
    stroke-width:10;
  }
  .briefing-chart-pos .ring-pct{
    font-size:24px;
    font-weight:800;
  }
  .briefing-chart-pos .ring-sub{
    font-size:10.5px;
    color:var(--text-dim);
    margin-top:2px;
  }

  /* 하단 부서 태그 칩 */
  .briefing-card-bottom-chips{
    margin-top:auto;
    padding-top:18px;
    z-index:2;
  }

  /* 우측 다가오는 일정 카드 */
  .briefing-card.upcoming-side-card{
    min-height:220px;
    transition: all 0.3s ease;
  }
  .upcoming-toggle-btn{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    text-align:left;
    cursor:pointer;
    user-select:none;
  }
  .upcoming-head-left{
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .upcoming-eyebrow{
    font-size:11.5px;
    font-weight:600;
    color:var(--text-dim);
  }
  .upcoming-title-text{
    font-size:20px;
    font-weight:800;
    letter-spacing:-0.02em;
    margin:0;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .upcoming-title-text .up-side-chevron{
    width:8px;
    height:8px;
    border-right:2px solid var(--text);
    border-bottom:2px solid var(--text);
    transform:rotate(45deg);
    transition:transform .25s ease;
    display:inline-block;
  }
  .upcoming-side-card:not(.open) .upcoming-title-text .up-side-chevron{
    transform:rotate(-45deg);
  }
  .upcoming-count-badge{
    width:28px;
    height:28px;
    border-radius:50%;
    background:rgba(255,159,10,0.18);
    border:1px solid rgba(255,159,10,0.3);
    color:#FF9F0A;
    font-size:12.5px;
    font-weight:800;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .upcoming-list-body{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:14px;
    overflow-y:auto;
    max-height:160px;
    transition: max-height 0.3s ease, opacity 0.25s ease;
  }
  .upcoming-side-card:not(.open) .upcoming-list-body{
    max-height: 0;
    opacity: 0;
    margin-top: 0;
    overflow: hidden;
  }

  .notice-toast{
    position:fixed;z-index:100;left:14px;right:14px;
    bottom:calc(14px + env(safe-area-inset-bottom));
    max-width:480px;margin:0 auto;display:flex;align-items:flex-start;gap:11px;
    background:rgba(250,250,252,0.86);
    -webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
    border:1px solid rgba(255,255,255,0.55);border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,0.45);padding:13px 13px 13px 15px;color:#1D1D1F;
  }
  .notice-toast-icon{
    flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:#FF9F0A;
    display:flex;align-items:center;justify-content:center;font-size:14px;
  }
  .notice-toast-body{flex:1;min-width:0;}
  .notice-toast-label{font-size:11px;font-weight:700;color:#86868B;margin:0 0 2px;}
  .notice-toast-text{font-size:13.5px;line-height:1.5;font-weight:500;margin:0;color:#1D1D1F;}
  .notice-toast-meta{font-size:10.5px;color:#86868B;margin:5px 0 0;}
  .notice-toast-close{
    flex:0 0 auto;width:26px;height:26px;border-radius:50%;
    background:rgba(0,0,0,0.07);display:flex;align-items:center;justify-content:center;
    color:#636369;font-size:14px;
  }

  .ring-wrap{flex:0 0 auto;position:relative;width:86px;height:86px;}
  .ring-wrap svg{transform:rotate(-90deg);display:block;}
  .ring-track{fill:none;stroke:rgba(var(--ink-rgb),0.08);stroke-width:8;}
  .ring-fill{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .8s, stroke .3s;}
  .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ring-pct{font-size:19px;font-weight:700;line-height:1;}
  .ring-sub{font-size:9px;color:var(--text-dim);font-weight:600;margin-top:2px;}
  
  .dept-chips{display:flex;flex-direction:column;gap:5px;}
  .dept-chips-row{display:flex;flex-wrap:wrap;gap:6px;}
  .dept-chip{
    display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;
    padding:6px 12px;border-radius:100px;background:rgba(var(--ink-rgb),0.06);border:1px solid rgba(var(--ink-rgb),0.09);
    color:var(--text-muted);
  }
  .dept-chip .chip-dot{width:6px;height:6px;border-radius:50%;background:#30D158;}
  .dept-chip.missing{background:rgba(255,69,58,0.12);border-color:rgba(255,69,58,0.25);color:#FF8A80;}
  .dept-chip.missing .chip-dot{background:#FF453A;}

  .up-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(var(--ink-rgb),0.035);border:1px solid rgba(var(--ink-rgb),0.07);border-radius:14px;}
  .up-dday{
    flex:0 0 46px;font-weight:700;font-size:11px;text-align:center;padding:5px 0;border-radius:8px;
    background:rgba(255,159,10,0.16);
    color:#FF9F0A;
  }
  .up-info{flex:1;min-width:0;}
  .up-title{font-size:13px;font-weight:700;color:var(--text);margin:0 0 2px;}
  .up-dept{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--text-dim);}
  .up-dept::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--up-color,var(--blue));}
  .up-empty{font-size:12px;color:var(--text-dim);text-align:center;padding:24px 0;}

  .state-box{text-align:center;padding:60px 20px;color:var(--text-muted);font-size:13px;}
  .state-box .big{font-size:15px;color:var(--text);font-weight:600;margin-bottom:6px;}
  .retry-btn{
    margin-top:14px;background:rgba(var(--ink-rgb),0.10);border:1px solid var(--glass-border-strong);
    color:var(--text);padding:10px 20px;border-radius:100px;font-size:13px;font-weight:600;
  }
  .skeleton{
    background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius);
    height:56px;margin-bottom:12px;position:relative;overflow:hidden;
  }

  .ms-panel{
    background:var(--glass);border:1px solid var(--glass-border);
    border-radius:var(--radius);padding:18px 18px 14px;margin:16px 18px 0;
    box-shadow:var(--glass-shadow), 0 0 16px rgba(255,159,10,0.2);
    transition:box-shadow 0.3s ease;
  }
  .ms-panel[data-progress="0"] { box-shadow:var(--glass-shadow), 0 0 12px rgba(255,159,10,0.15); }
  .ms-panel[data-progress="1"] { box-shadow:var(--glass-shadow), 0 0 18px var(--dept-color,#FF9F0A); }
  .ms-panel[data-progress="2"] { box-shadow:var(--glass-shadow), 0 0 24px var(--dept-color,#FF9F0A), 0 0 32px rgba(255,159,10,0.4); animation:card-glow 2.5s ease-in-out infinite; }
  @keyframes card-glow{0%,100%{box-shadow:var(--glass-shadow), 0 0 24px var(--dept-color,#FF9F0A), 0 0 32px rgba(255,159,10,0.4);}50%{box-shadow:var(--glass-shadow), 0 0 32px var(--dept-color,#FF9F0A), 0 0 48px rgba(255,159,10,0.6);}}
  @keyframes bar-glow{0%,100%{box-shadow:0 0 12px var(--dept-color,#30D158), 0 0 20px rgba(255,159,10,0.5);}50%{box-shadow:0 0 16px var(--dept-color,#30D158), 0 0 28px rgba(255,159,10,0.7);}}
  .ms-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px;width:100%;}
  .ms-head-left{display:flex;align-items:center;gap:9px;min-width:0;}
  .ms-chevron{
    width:7px;height:7px;flex:0 0 auto;border-right:2px solid var(--text);border-bottom:2px solid var(--text);
    transform:rotate(-45deg);transition:transform .25s ease;
  }
  .ms-panel.open .ms-chevron{transform:rotate(45deg);margin-top:-3px;}
  .ms-panel:not(.open) .ms-body{display:none;}
  .ms-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px;min-width:0;text-align:left;}
  .ms-title-text{display:flex;align-items:center;gap:5px;min-width:0;line-height:1.35;}
  .ms-dept{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ms-sub{color:var(--text-dim);font-weight:600;white-space:nowrap;}
  .ms-sub::before{content:'· ';}
  .ms-title .ms-dot{width:8px;height:8px;border-radius:50%;background:var(--dept-color,var(--blue));}
  .ms-badge{
    font-size:10px;font-weight:600;color:var(--text-muted);padding:3px 9px;border-radius:100px;
    background:var(--glass);border:1px solid var(--glass-border);
  }
  .ms-row{padding:12px 0 4px;}
  .ms-row + .ms-row{border-top:1px solid var(--glass-border);}
  .ms-row-top{display:flex;align-items:center;gap:10px;}
  .ms-del{flex:0 0 auto;font-size:13px;opacity:.4;padding:4px;}
  .ms-info{flex:1;min-width:0;}
  .ms-name{font-size:13px;font-weight:700;margin:0;}
  .ms-desc{font-size:11px;color:var(--text-muted);margin:2px 0 0;}
  .ms-counter{flex:0 0 auto;display:flex;align-items:center;gap:8px;}
  .ms-btn{
    width:28px;height:28px;border-radius:50%;background:var(--glass);border:1px solid var(--glass-border);
    display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--text);
  }
  .ms-count{font-size:13px;font-weight:700;min-width:64px;text-align:center;}
  .ms-count .cur{color:var(--dept-color,var(--blue));}
  .ms-track{height:5px;border-radius:100px;background:rgba(var(--ink-rgb),0.08);margin-top:10px;overflow:visible;}
  .ms-fill{height:100%;border-radius:100px;background:var(--dept-color,var(--blue));transition:width .35s ease;box-shadow:0 0 8px var(--dept-color,var(--blue)), 0 0 12px rgba(255,159,10,0.3);}
  .ms-fill.done{background:var(--dept-color,#30D158);box-shadow:0 0 12px var(--dept-color,#30D158), 0 0 20px rgba(255,159,10,0.5);animation:bar-glow 2s ease-in-out infinite;}
  .ms-empty{font-size:12px;color:var(--text-dim);text-align:center;padding:16px 0 10px;}
  .ms-form{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--glass-border);}
  .ms-input{
    background:var(--glass);border:1px solid var(--glass-border);border-radius:12px;
    padding:9px 12px;font:inherit;font-size:12px;color:var(--text);outline:none;min-width:0;
  }
  .ms-in-title{flex:1 1 160px;}
  .ms-num-group{flex:0 0 auto;display:flex;gap:8px;}
  .ms-in-target{flex:0 0 60px;width:60px;text-align:center;}
  .ms-in-unit{flex:0 0 62px;width:62px;text-align:center;}
  .ms-in-desc{flex:1 1 100%;}
  .ms-add-btn{
    flex:0 0 auto;margin-left:auto;background:var(--dept-color,var(--blue));color:#fff;
    border-radius:12px;padding:9px 18px;font-size:12.5px;font-weight:700;
  }

  .ms-archive{margin-top:14px;padding-top:12px;border-top:1px solid rgba(var(--ink-rgb),0.07);}
  .ms-archive-toggle{display:flex;align-items:center;gap:7px;width:100%;font-size:11.5px;font-weight:600;color:var(--text-muted);}
  .ms-archive-chevron{width:6px;height:6px;border-right:1.5px solid var(--text-dim);border-bottom:1.5px solid var(--text-dim);transform:rotate(-45deg);}
  .ms-archive.open .ms-archive-chevron{transform:rotate(45deg);}
  .ms-archive-body{display:none;margin-top:10px;flex-direction:column;gap:2px;}
  .ms-archive.open .ms-archive-body{display:flex;}
  .ms-archive-nav{display:flex;align-items:center;justify-content:center;gap:14px;padding-bottom:8px;margin-bottom:6px;border-bottom:1px solid rgba(var(--ink-rgb),0.06);}
  .ms-archive-nav-btn{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--text);background:rgba(var(--ink-rgb),0.06);border:1px solid rgba(var(--ink-rgb),0.09);}
  .ms-archive-nav-label{font-size:12px;font-weight:700;color:var(--text);min-width:120px;text-align:center;}
  .ms-archive-empty{font-size:12px;color:var(--text-dim);text-align:center;padding:14px 0 6px;}
  .ms-archive-row{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-muted);padding:5px 0;}
  .ms-archive-row-title{flex:1;min-width:0;color:var(--text);}
  .ms-archive-row-count{flex:0 0 auto;color:var(--text-dim);}

  /* ---------- 스위치 / 레이아웃 (하단 고정 네비게이션 바 - 갤럭시 스타일) ---------- */
  .mode-switch{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    display:flex;gap:2px;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    background:rgba(5,5,7,0.78);
    -webkit-backdrop-filter:blur(28px) saturate(180%);
    backdrop-filter:blur(28px) saturate(180%);
    border-top:1px solid rgba(255,255,255,0.08);
    box-shadow:0 -8px 32px rgba(0,0,0,0.4);
  }
  body.light .mode-switch{
    background:rgba(242,242,247,0.85);
    border-top-color:rgba(0,0,0,0.07);
    box-shadow:0 -8px 24px rgba(0,0,0,0.08);
  }
  .mode-btn{
    flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;padding:8px 4px 6px;border-radius:14px;
    font-size:10.5px;font-weight:600;color:var(--text-muted);
    -webkit-tap-highlight-color:transparent;
    transition:background .18s ease,color .18s ease,transform .1s ease;
  }
  .mode-btn:active{transform:scale(.93);}
  .mode-btn-icon{font-size:19px;line-height:1;transition:transform .18s ease;}
  .mode-btn-label{white-space:nowrap;letter-spacing:-.01em;}
  .mode-btn.active{
    color:var(--blue);
    background:color-mix(in srgb, var(--blue) 14%, transparent);
  }
  .mode-btn.active .mode-btn-icon{transform:translateY(-1px) scale(1.08);}
  body.light .mode-btn.active{background:color-mix(in srgb, var(--blue) 10%, transparent);}
  @media (min-width:640px){
    .mode-switch{
      left:50%;right:auto;bottom:18px;transform:translateX(-50%);
      width:max-content;gap:4px;padding:6px;border-radius:100px;
      border:1px solid rgba(255,255,255,0.08);
    }
    body.light .mode-switch{border-color:rgba(0,0,0,0.07);}
    .mode-btn{flex-direction:row;padding:9px 18px;border-radius:100px;font-size:13px;gap:6px;}
    .mode-btn-icon{font-size:14px;}
    .mode-btn.active .mode-btn-icon{transform:none;}
  }
  
  /* ================= 주간 피드백 회의모드 ================= */
  #meetingMode,#sermonPrep{display:none;padding:18px;max-width:1440px;margin:0 auto}
  body.meeting-active #meetingMode{display:block}
  body.meeting-active #normalDashboard, body.meeting-active #sermonPrep{display:none}
  body.prep-active #sermonPrep{display:block}
  body.prep-active #normalDashboard, body.prep-active #meetingMode{display:none}
  body.meeting-active header, body.prep-active header{position:relative}

  .pf-hero{display:flex;justify-content:space-between;align-items:center;margin:4px 0 16px;}
  .pf-title-area{display:flex;flex-direction:column;gap:4px;}
  .pf-title{font-size:26px;font-weight:800;margin:0;letter-spacing:-.03em;display:flex;align-items:center;gap:8px;}
  .pf-sub{font-size:12.5px;color:var(--text-muted);margin:0;}
  .pf-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .pf-btn{
    display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:12px;
    font-size:12.5px;font-weight:700;background:var(--glass);border:1px solid var(--glass-border);
    color:var(--text);transition:all .15s;
  }
  .pf-btn.primary{background:#0A84FF;color:#fff;border-color:#0A84FF;}
  .pf-btn.ppt-btn{background:linear-gradient(135deg, #FF9F0A, #FF3B30);color:#fff;border:none;}
  .pf-btn:active{transform:scale(0.97);}

  /* 상단 5개 과 선택 탭 바 */
  .pf-dept-tabs{display:grid;grid-template-columns:repeat(5, 1fr);gap:10px;margin-bottom:18px;}
  .pf-dept-tab{
    padding:16px;border-radius:16px;background:rgba(var(--ink-rgb),0.03);
    border:1px solid rgba(var(--ink-rgb),0.08);text-align:center;
    font-size:14.5px;font-weight:700;color:var(--text-muted);
    cursor:pointer;transition:all .2s ease;
  }
  .pf-dept-tab:hover{background:rgba(var(--ink-rgb),0.06);}
  .pf-dept-tab.active{
    background:rgba(var(--ink-rgb),0.08);
    border-color:var(--dept-color, #FF9F0A);
    color:var(--text);
    box-shadow:0 0 16px color-mix(in srgb, var(--dept-color, #FF9F0A) 30%, transparent);
  }

  /* 회의모드 상단 2열 마일스톤 영역 (전달 / 이번달) */
  .pf-milestones-row{
    display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;
  }

  .pf-summary-card{
    background:var(--glass);border:1px solid var(--glass-border);
    border-radius:20px;padding:14px 18px;
    box-shadow:var(--glass-shadow), 0 0 16px rgba(255,159,10,0.2);display:flex;flex-direction:column;gap:10px;
    width:100%; min-width:0;transition:box-shadow 0.3s ease;
  }
  .pf-summary-card.last-month{
    border-color:rgba(var(--ink-rgb),0.12);
    box-shadow:var(--glass-shadow);
  }
  .pf-summary-card[data-progress="0"] { box-shadow:var(--glass-shadow), 0 0 12px rgba(255,159,10,0.15); }
  .pf-summary-card[data-progress="1"] { box-shadow:var(--glass-shadow), 0 0 18px var(--dept-color,#FF9F0A); }
  .pf-summary-card[data-progress="2"] { box-shadow:var(--glass-shadow), 0 0 24px var(--dept-color,#FF9F0A), 0 0 32px rgba(255,159,10,0.4); animation:card-glow 2.5s ease-in-out infinite; }
  .pf-summary-head{
    display:flex;align-items:center;justify-content:space-between;
    gap:6px;width:100%;min-width:0;
    white-space:nowrap;flex-wrap:nowrap !important;
  }
  .pf-summary-title{
    font-size:clamp(10px, 3.2vw, 13.5px);font-weight:700;
    display:flex;align-items:center;gap:5px;margin:0;
    white-space:nowrap;overflow:hidden;
    flex:1 1 auto;min-width:0;line-height:1.35;
  }
  .pf-summary-dept{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pf-summary-sub{color:var(--text-dim);font-weight:600;white-space:nowrap;}
  .pf-summary-sub::before{content:'· ';}
  .pf-summary-stats{
    display:flex;align-items:center;gap:3px;
    font-size:clamp(10px, 3vw, 12.5px);font-weight:700;
    white-space:nowrap;flex-shrink:0;margin-left:auto;
  }
  .pf-summary-stats span b{color:var(--dept-color, #0A84FF);font-size:clamp(11px, 3.2vw, 14.5px);}
  .pf-summary-bar-bg{height:8px;border-radius:100px;background:rgba(var(--ink-rgb),0.08);overflow:visible;}
  .pf-summary-bar-fill{height:100%;border-radius:100px;background:var(--dept-color, #0A84FF);transition:width .4s ease;box-shadow:0 0 10px var(--dept-color, #0A84FF), 0 0 16px rgba(255,159,10,0.4);animation:bar-glow 2s ease-in-out infinite;}

  .pf-ms-history-list{
    display:flex;flex-direction:column;gap:6px;margin-top:2px;max-height:140px;overflow-y:auto;
  }
  .pf-ms-history-item{
    display:flex;align-items:flex-start;justify-content:space-between;gap:6px;
    font-size:11.5px;color:var(--text-muted);padding:4px 0;border-top:1px solid rgba(var(--ink-rgb),0.05);
  }
  .pf-ms-history-item:first-child{border-top:none;}
  .pf-ms-history-content{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .pf-ms-history-title{color:var(--text);font-weight:600;line-height:1.3;word-break:break-all;}
  .pf-ms-history-desc{font-size:10.5px;color:var(--text-dim);line-height:1.3;word-break:break-all;}
  .pf-ms-history-val{font-size:11px;color:var(--text-dim);flex-shrink:0;padding-top:1px;}

  /* 하단 3컬럼 영역 */
  .pf-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch;}
  .pf-card{
    background:var(--glass);border:1px solid var(--glass-border);
    border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;
    box-shadow:var(--glass-shadow);
  }
  .pf-card-head{display:flex;align-items:center;justify-content:space-between;}
  .pf-card-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;margin:0;}
  .pf-card-title small{font-size:11px;color:var(--text-dim);font-weight:500;}
  .pf-card-count{font-size:13px;font-weight:800;color:#0A84FF;}

  .pf-card.highlight{
    border-color:rgba(255,159,10,0.4);
    box-shadow:0 0 24px rgba(255,159,10,0.08);
  }
  .pf-card.highlight .pf-card-title{color:#FF9F0A;}
  .pf-card.highlight .pf-card-count{color:#FF9F0A;}

  .pf-desc{font-size:11px;color:var(--text-dim);margin:-6px 0 4px;line-height:1.4;}

  .pf-list{display:flex;flex-direction:column;gap:10px;flex:1;}
  .pf-item-box{
    background:rgba(var(--ink-rgb),0.035);border:1px solid rgba(var(--ink-rgb),0.07);
    border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;
  }
  .pf-item-tag{font-size:10px;color:var(--text-dim);font-weight:600;}
  .pf-item-title{font-size:13px;font-weight:700;color:var(--text);}
  .pf-item-desc{font-size:11.5px;color:var(--text-muted);line-height:1.4;}

  .pf-row-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:rgba(var(--ink-rgb),0.04);border:1px solid rgba(var(--ink-rgb),0.08);border-radius:12px;font-size:12.5px;color:var(--text);}
  .pf-del-btn{color:var(--text-dim);font-size:13px;padding:2px 6px;opacity:.6;transition:opacity .15s;}
  .pf-del-btn:hover{opacity:1;color:#FF453A;}

  .pf-input-group{display:flex;gap:8px;margin-top:auto;}
  .pf-input,.pf-textarea{
    flex:1;background:rgba(var(--ink-rgb),0.04);border:1px solid var(--glass-border);
    border-radius:12px;padding:11px 14px;font:inherit;font-size:12.5px;color:var(--text);outline:none;
  }
  .pf-textarea{min-height:90px;resize:vertical;line-height:1.5;}
  .pf-input:focus,.pf-textarea:focus{border-color:#0A84FF;}
  .pf-input-btn{
    width:38px;height:38px;border-radius:12px;background:#0A84FF;color:#fff;
    font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;
  }
  .pf-input-btn.orange{background:#FF9F0A;}

  /* ===== 지난주 지시 확인(회수) 카드 ===== */
  .pf-review-card{
    background:var(--glass);border:1px solid rgba(48,209,88,0.35);
    border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;
    box-shadow:0 0 24px rgba(48,209,88,0.07);margin-bottom:16px;
  }
  .pf-review-card .pf-card-title{color:#30D158;}
  .pf-review-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .pf-review-stat{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--text-dim);}
  .pf-review-stat b{font-size:15px;color:#30D158;}
  .pf-review-bar{width:120px;height:6px;border-radius:100px;background:rgba(var(--ink-rgb),0.1);overflow:hidden;}
  .pf-review-bar span{display:block;height:100%;background:#30D158;border-radius:100px;transition:width .4s ease;}
  .pf-review-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .pf-review-item{
    background:rgba(var(--ink-rgb),0.04);border:1px solid rgba(var(--ink-rgb),0.08);
    border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;
  }
  .pf-review-item.warn{border-color:rgba(255,69,58,0.45);background:rgba(255,69,58,0.06);}
  .pf-review-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .pf-review-text{font-size:12.5px;font-weight:600;color:var(--text);line-height:1.4;word-break:break-all;}
  .pf-review-tags{display:flex;align-items:center;gap:5px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
  .pf-tag{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:100px;background:rgba(var(--ink-rgb),0.08);color:var(--text-dim);white-space:nowrap;}
  .pf-tag.src{background:rgba(10,132,255,0.15);color:#0A84FF;}
  .pf-tag.carry{background:rgba(255,159,10,0.18);color:#FF9F0A;}
  .pf-tag.carry.danger{background:rgba(255,69,58,0.2);color:#FF453A;}
  .pf-tag.week{background:rgba(var(--ink-rgb),0.06);}
  .pf-review-btns{display:flex;gap:6px;}
  .pf-rb{
    flex:1;padding:7px 4px;border-radius:10px;font-size:11px;font-weight:700;
    background:rgba(var(--ink-rgb),0.05);border:1px solid rgba(var(--ink-rgb),0.1);color:var(--text-muted);
    transition:all .15s;
  }
  .pf-rb:hover{background:rgba(var(--ink-rgb),0.1);}
  .pf-rb.on.done{background:#30D158;border-color:#30D158;color:#fff;}
  .pf-rb.on.doing{background:#0A84FF;border-color:#0A84FF;color:#fff;}
  .pf-rb.on.carry{background:#FF9F0A;border-color:#FF9F0A;color:#fff;}
  .pf-rb.on.drop{background:#8E8E93;border-color:#8E8E93;color:#fff;}
  .pf-review-empty{font-size:12px;color:var(--text-dim);padding:14px;text-align:center;
    background:rgba(var(--ink-rgb),0.03);border-radius:12px;grid-column:1 / -1;}
  .pf-week-chip{
    font-size:11px;font-weight:700;padding:4px 10px;border-radius:100px;
    background:rgba(10,132,255,0.15);color:#0A84FF;
  }

  /* ===== 월말보고서 ===== */
  .report-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .report-gen-btn{
    padding:9px 16px;border-radius:12px;font-size:12.5px;font-weight:700;
    background:#0A84FF;color:#fff;border:none;
  }
  .report-gen-btn.ghost{background:rgba(var(--ink-rgb),0.06);color:var(--text);border:1px solid var(--glass-border);}
  .exec-strip{
    display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 2px;padding:12px;
    background:rgba(var(--ink-rgb),0.035);border:1px solid rgba(var(--ink-rgb),0.08);border-radius:14px;
  }
  .exec-cell{flex:1;min-width:110px;display:flex;flex-direction:column;gap:3px;}
  .exec-cell-label{font-size:10.5px;color:var(--text-dim);font-weight:600;}
  .exec-cell-val{font-size:16px;font-weight:800;color:var(--text);}
  .exec-cell-val.good{color:#30D158;}
  .exec-cell-val.warn{color:#FF9F0A;}
  .exec-cell-val.bad{color:#FF453A;}
  .report-modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(6px);
    z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .report-modal{
    width:min(760px,100%);max-height:86vh;display:flex;flex-direction:column;gap:12px;
    background:var(--bg);border:1px solid var(--glass-border);border-radius:22px;padding:20px;
    box-shadow:0 20px 60px rgba(0,0,0,0.4);
  }
  .report-modal-head{display:flex;align-items:center;justify-content:space-between;}
  .report-modal-head h2{font-size:17px;margin:0;}
  .report-modal-body{
    flex:1;overflow:auto;white-space:pre-wrap;font-size:12.5px;line-height:1.65;
    background:rgba(var(--ink-rgb),0.04);border:1px solid rgba(var(--ink-rgb),0.08);
    border-radius:14px;padding:16px;color:var(--text);font-family:var(--mono, inherit);
  }

  @media (max-width: 900px){
    .pf-review-list{grid-template-columns:1fr;}
  }

  /* 전체 공통 메모 박스 카드 */
  .pf-memo-card{
    grid-column: 1 / -1; margin-top: 4px;
    background:var(--glass);border:1px solid var(--glass-border);
    border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:12px;
    box-shadow:var(--glass-shadow);
  }
  .pf-memo-card .pf-card-title{font-size:16px;}
  .pf-memo-card .pf-desc{font-size:12px;}
  .pf-memo-card .pf-textarea{
    min-height:240px;font-size:15px;line-height:1.75;padding:16px 18px;
  }

  .meeting-toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    padding:10px 16px;background:rgba(30,30,32,.95);border:1px solid rgba(255,255,255,.15);
    border-radius:100px;z-index:500;font-size:12px;display:none;
  }

  .prep-hero{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin:4px 0 18px}
  .prep-title{font-size:30px;font-weight:800;margin:0 0 5px;letter-spacing:-.04em}
  .prep-sub{font-size:13px;color:var(--text-muted);margin:0}
  .prep-card{background:var(--glass);border:1px solid var(--glass-border);border-radius:22px;padding:22px;box-shadow:var(--glass-shadow);backdrop-filter:blur(24px)}
  .prep-field{display:flex;flex-direction:column;gap:8px}.prep-label{font-size:14px;color:var(--text);font-weight:700}
  .prep-input,.prep-textarea{width:100%;background:rgba(var(--ink-rgb),.04);border:1px solid var(--glass-border);color:var(--text);border-radius:12px;padding:14px 16px;font:inherit;font-size:14px;outline:none}
  .prep-textarea.tall{min-height:300px;resize:vertical;line-height:1.6}
  .prep-savebar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border:1px solid var(--glass-border);background:var(--glass);border-radius:16px;margin-top:20px}
  .prep-saved{font-size:12px;color:#30D158}

  /* PPT 미리보기 프레임 스타일 */
  .ppt-preview-container{margin-top:20px;background:var(--glass);border:1px solid var(--glass-border);border-radius:22px;padding:20px;box-shadow:var(--glass-shadow);display:none;}
  .ppt-preview-container.active{display:block;}
  .ppt-preview-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .ppt-preview-title{font-size:14px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px;}
  .ppt-iframe-wrap{width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;border:1px solid var(--glass-border);}
  .ppt-iframe-wrap iframe{width:100%;height:100%;border:none;}
  .ppt-preview-empty{display:grid;place-items:center;height:100%;color:var(--text-dim);font-size:13px;padding:0 20px;text-align:center;line-height:1.6}

  /* PPT 디자인 설정 패널 */
  .ppt-style-panel{margin-top:16px;border-top:1px solid var(--glass-border);padding-top:16px}
  .ppt-style-toggle{background:none;border:none;color:var(--text);font:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:0;display:flex;align-items:center;gap:7px}
  .ppt-style-toggle .cx{width:6px;height:6px;border-right:2px solid var(--text-dim);border-bottom:2px solid var(--text-dim);transform:rotate(-45deg);transition:transform .2s ease}
  .ppt-style-panel.open .ppt-style-toggle .cx{transform:rotate(45deg);margin-top:-3px}
  .ppt-style-body{display:none;margin-top:14px}
  .ppt-style-panel.open .ppt-style-body{display:block}
  .ppt-style-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
  .ppt-style-field{display:flex;flex-direction:column;gap:6px;min-width:0}
  .ppt-style-field > span{font-size:11px;color:var(--text-dim);font-weight:700;display:flex;justify-content:space-between;gap:6px}
  .ppt-style-field select{width:100%;background:rgba(var(--ink-rgb),.04);border:1px solid var(--glass-border);color:var(--text);border-radius:10px;padding:9px 10px;font:inherit;font-size:12.5px;outline:none}
  .ppt-style-field input[type=range]{width:100%;accent-color:var(--blue)}
  .ppt-style-val{color:var(--text-muted);font-weight:800}
  .ppt-style-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .ppt-style-hint{font-size:11px;color:var(--text-dim);margin-top:10px;line-height:1.6}

  .shared-followup{margin:16px 18px 0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .shared-card{background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius);padding:16px;box-shadow:var(--glass-shadow)}
  .shared-card h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;user-select:none;}
  .shared-card h3 > span:first-child{display:flex;align-items:center;gap:5px;}
  .shared-card-chevron{width:7px;height:7px;border-right:2px solid var(--text-dim);border-bottom:2px solid var(--text-dim);transform:rotate(45deg);transition:transform .2s ease;display:inline-block;flex:0 0 auto;}
  .shared-card.collapsed h3{margin-bottom:0;}
  .shared-card.collapsed .shared-card-chevron{transform:rotate(-45deg);}
  .shared-card.collapsed .shared-list{display:none;}
  .shared-list{display:flex;flex-direction:column;gap:8px}
  .shared-item{display:flex;align-items:center;justify-content:space-between;gap:9px;padding:10px 0;border-top:1px solid var(--glass-border);font-size:12px}
  .shared-item:first-child{border-top:0}
  .shared-item-left{display:flex;align-items:flex-start;gap:9px;flex:1;min-width:0;cursor:pointer;}
  .shared-item input{accent-color:#30D158;margin-top:3px;width:17px;height:17px;flex:0 0 auto}
  .shared-item-body{flex:1;min-width:0}
  .shared-item-title{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .shared-dept-badge{display:inline-flex;align-items:center;padding:3px 7px;border-radius:100px;background:color-mix(in srgb,var(--badge-color,#0A84FF) 15%,transparent);color:var(--badge-color,#0A84FF);font-size:9.5px;font-weight:800;white-space:nowrap}
  .shared-meta{font-size:10px;color:var(--text-dim);margin-top:4px}
  .shared-del-btn{color:var(--text-dim);font-size:13px;padding:4px 8px;opacity:.6;transition:opacity .15s;flex:0 0 auto;border-radius:6px;}
  .shared-del-btn:hover{opacity:1;color:#FF453A;background:rgba(255,69,58,0.12);}
  .sync-state{font-size:10px;color:#30D158;white-space:nowrap}
  .shared-empty{padding:12px 2px;color:var(--text-dim);font-size:11.5px}
  .shared-scope{margin:16px 18px 0;font-size:11px;color:var(--text-muted);font-weight:700}

  .shared-item.is-done .shared-item-title b{text-decoration:line-through;color:var(--text-dim);opacity:.7;}
  .shared-item.is-done .shared-meta{color:#30D158;}

  /* ===== 업무별 코멘트 ===== */
  .shared-item-body{cursor:pointer;border-radius:8px;transition:background .15s;}
  .shared-item-body:hover{background:rgba(var(--ink-rgb),0.05);}
  .cmt-badge{
    display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:100px;
    background:rgba(10,132,255,0.15);color:#0A84FF;font-size:9.5px;font-weight:800;white-space:nowrap;
  }
  .cmt-badge.empty{background:rgba(var(--ink-rgb),0.07);color:var(--text-dim);}

  .task-modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.62);backdrop-filter:blur(6px);
    z-index:9200;display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .task-modal{
    width:min(600px,100%);max-height:88vh;display:flex;flex-direction:column;
    background:var(--bg);border:1px solid var(--glass-border);border-radius:22px;
    box-shadow:0 24px 70px rgba(0,0,0,0.45);overflow:hidden;
  }
  .task-modal-head{
    padding:16px 18px;border-bottom:1px solid rgba(var(--ink-rgb),0.08);background:var(--glass);
    display:flex;align-items:flex-start;gap:12px;
  }
  .task-modal-head-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;}
  .task-modal-title{font-size:15.5px;font-weight:800;margin:0;line-height:1.4;word-break:break-all;}
  .task-modal-tags{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .task-modal-close{
    width:32px;height:32px;flex:0 0 auto;border-radius:50%;
    background:rgba(var(--ink-rgb),0.07);border:1px solid rgba(var(--ink-rgb),0.1);
    color:var(--text);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;
  }
  .task-modal-close:hover{background:rgba(255,69,58,0.18);color:#FF453A;}
  .cmt-thread{
    flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px;
    min-height:180px;
  }
  .cmt-empty{color:var(--text-dim);font-size:12px;text-align:center;padding:26px 10px;}
  .cmt-row{display:flex;flex-direction:column;gap:4px;max-width:82%;}
  .cmt-row.check{align-self:flex-start;}
  .cmt-row.work{align-self:flex-end;align-items:flex-end;}
  .cmt-who{font-size:10px;font-weight:800;color:var(--text-dim);padding:0 4px;}

const THEME_KEY = 'dashboardTheme';

function applyTheme(theme){
  document.body.classList.toggle('light', theme === 'light');
  document.querySelectorAll('.theme-opt').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.theme === theme);
  });
  try{ localStorage.setItem(THEME_KEY, theme); }catch(e){}
}

(function initTheme(){
  let saved = 'dark';
  try{ saved = localStorage.getItem(THEME_KEY) || 'dark'; }catch(e){}
  const run = ()=>{
    applyTheme(saved);
    document.querySelectorAll('.theme-opt').forEach(btn=>{
      btn.onclick = ()=>applyTheme(btn.dataset.theme);
    });
  };
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run);
  else run();
})();

function logVisit(){

function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())}`;
}

function deptTotalCount(dept){
  if(!state.data) return 0;
  const deptData = state.data.departments[dept];
  if(!deptData) return 0;
  const bucket = deptData[state.range];
  return Object.values(bucket).reduce((sum,c)=>sum + (c.count||0), 0);
}

function catCount(dept, category){
  if(!state.data) return 0;
  const deptData = state.data.departments[dept];
  if(!deptData) return 0;
  const bucket = deptData[state.range];
  return (bucket[category] && bucket[category].count) || 0;
}

function msGaugeFor(dept){
  const goals = goalsFor(dept);
  if(!goals.length){
    return {
      cls: 'none', stat: '목표 없음', segs: '<span class="ms-seg"></span>',
      title: dept + ' · 이번 달 마일스톤이 등록되지 않았습니다'
    };
  }
  let sumCur = 0, sumTarget = 0, done = 0;
  const segs = goals.slice(0, 8).map(g=>{
    const tgt = Math.max(1, Number(g.target) || 1);
    const cur = Math.min(Math.max(0, Number(g.current) || 0), tgt);
    sumCur += cur; sumTarget += tgt;
    if(cur >= tgt) done++;
    const p = Math.round(cur / tgt * 100);
    return `<span class="ms-seg"><span class="ms-seg-fill" style="width:${p}%"></span></span>`;
  }).join('');

  const pct = Math.round(sumCur / sumTarget * 100);
  const allDone = done === goals.length;
  const cls = allDone ? 'done' : (pct >= 67) ? 'high' : (pct >= 34) ? 'mid' : 'low';

  return {
    cls: cls,
    stat: (allDone ? '✓ ' : '') + done + '/' + goals.length + ' · ' + pct + '%',
    segs: segs,
    title: dept + ' · 마일스톤 ' + done + '/' + goals.length + ' 달성 (전체 진행률 ' + pct + '%)'
  };
}

function msGaugeHtml(dept){
  const g = msGaugeFor(dept);
  return `

        <div class="ms-gauge-top">
          <span class="ms-gauge-bulb"></span>
          <span class="ms-gauge-label">마일스톤</span>
          <span class="ms-gauge-stat mono">${g.stat}</span>

}

    return `

        <span class="chart-bar-track">
          <span class="chart-bar-fill" style="width:${pct}%;background:var(--dept-${DEPT_COLOR_KEY[dept]})"></span>
        </span>

function fmtDday(n){
  if(n === 0) return 'D-DAY';
  return 'D-' + n;
}

function dateKey(d){
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}

function startOfWeek(date){
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  return new Date(d.setDate(diff));
}

/* ================= 주차 키 유틸 (회의 = 일요일 시작 주) ================= */
function startOfMeetingWeek(date){
  const src = date ? new Date(date) : new Date();
  const d = new Date(src.getFullYear(), src.getMonth(), src.getDate());
  d.setDate(d.getDate() - d.getDay());
  return d;
}

/* 주차 키: 그 주 일요일 날짜 (예: '2026-08-09') */
function weekKeyOf(date){
  const s = startOfMeetingWeek(date);
  const p = n => String(n).padStart(2,'0');
  return `${s.getFullYear()}-${p(s.getMonth()+1)}-${p(s.getDate())}`;
}

const DOW_KR = ['일','월','화','수','목','금','토'];

function weekLabelOf(key){
  const parts = String(key||'').split('-').map(Number);
  if(parts.length < 3 || !parts[0]) return '주차 미상';
  const s = new Date(parts[0], parts[1]-1, parts[2]);
  const e = new Date(parts[0], parts[1]-1, parts[2]+6);
  const f = x => `${x.getMonth()+1}.${x.getDate()}(${DOW_KR[x.getDay()]})`;
  return `${f(s)}–${f(e)}`;
}

/* 주차가 속한 월 (그 주 목요일 기준 = 주의 과반이 속한 달) */
function monthKeyOfWeek(key){
  const parts = String(key||'').split('-').map(Number);
  if(parts.length < 3 || !parts[0]) return monthKeyOf();
  const thu = new Date(parts[0], parts[1]-1, parts[2]+4);
  return monthKeyOf(thu);
}

function uid(){
  return 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

function renderScheduleInto(targetId){
  const wrap = document.getElementById(targetId || 'scheduleSection');
  if(!wrap) return;
  if(!state.data || !state.dept || state.range === 'yearly'){ wrap.innerHTML=''; return; }

  const isAll = state.dept === ALL_DEPTS;
  const schedules = state.data.schedules || {};

  let items = [];
  if(isAll){
    DEPTS.forEach(dept=>{
      (schedules[dept] || []).forEach(it=>items.push({ ...it, dept }));
    });
  } else {
    items = (schedules[state.dept] || []).map(it=>({ ...it, dept: state.dept }));
  }

  const deptVar = isAll ? 'var(--blue)' : `var(--dept-${DEPT_COLOR_KEY[state.dept]})`;
  const now = new Date();
  const todayKey = dateKey(now);

  const eventsByDate = {};
  items.forEach(it=>{
    const d = new Date(it.date);
    const key = dateKey(d);
    if(!eventsByDate[key]) eventsByDate[key] = [];
    eventsByDate[key].push(it);
  });

  if(state.selectedDate == null || state.lastTodayKey !== todayKey){
    state.selectedDate = todayKey;
    state.lastTodayKey = todayKey;
  }

  function dayDots(key){
    const evs = eventsByDate[key];
    if(!evs) return '';
    if(!isAll) return '<span class="calendar-day-dot"></span>';
    const seen = [];
    evs.forEach(ev=>{
      const c = `var(--dept-${DEPT_COLOR_KEY[ev.dept]})`;
      if(seen.indexOf(c) === -1) seen.push(c);
    });
    return '<span class="calendar-day-dots">' +
      seen.slice(0,3).map(c=>`<span class="dot" style="background:${c}"></span>`).join('') +
      '</span>';
  }

  let headerLabel, cells;

  if(state.range === 'weekly'){
    const weekStart = startOfWeek(now);
    const days = [...Array(7)].map((_,i)=>new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate()+i));
    const p = n => String(n).padStart(2,'0');
    headerLabel = `${p(days[0].getMonth()+1)}.${p(days[0].getDate())} - ${p(days[6].getMonth()+1)}.${p(days[6].getDate())}`;
    cells = days.map(d=>{
      const key = dateKey(d);
      const isToday = key === todayKey;
      const isSelected = key === state.selectedDate;
      return `
        <button class="calendar-day ${isToday?'today':''} ${isSelected?'selected':''}" style="--dept-color:${deptVar}" data-key="${key}">
          <span>${d.getDate()}</span>
          ${dayDots(key)}
        </button>`;
    }).join('');
  } else {
    const year = now.getFullYear(), month = now.getMonth();
    const firstDow = new Date(year, month, 1).getDay();
    const totalDays = new Date(year, month + 1, 0).getDate();
    headerLabel = `${year}년 ${month+1}월`;
    let html = '';
    for(let i=0;i<firstDow;i++) html += `<span class="calendar-day-empty"></span>`;
    for(let day=1; day<=totalDays; day++){
      const d = new Date(year, month, day);
      const key = dateKey(d);
      const isToday = key === todayKey;
      const isSelected = key === state.selectedDate;
      html += `
        <button class="calendar-day ${isToday?'today':''} ${isSelected?'selected':''}" style="--dept-color:${deptVar}" data-key="${key}">
          <span>${day}</span>
          ${dayDots(key)}
        </button>`;
    }
    cells = html;
  }

  const selectedEvents = (eventsByDate[state.selectedDate] || []).slice().sort((a,b)=>a.dDay-b.dDay);
  const [sy, sm, sd] = state.selectedDate.split('-');
  const detailRows = selectedEvents.length
    ? selectedEvents.map(it => {
        const rowVar = `var(--dept-${DEPT_COLOR_KEY[it.dept]})`;
        return `
        <div class="schedule-row" style="--dept-color:${isAll ? rowVar : deptVar}">
          <span class="schedule-dday">${fmtDday(it.dDay)}</span>
          <div class="schedule-info">
            <p class="schedule-title">${escapeHtml(it.title||'')}</p>
            ${it.content ? `<p class="schedule-meta">${escapeHtml(it.content)}</p>` : ''}
            ${isAll ? `<span class="schedule-dept-tag">${escapeHtml(it.dept)}</span>` : ''}
          </div>
        </div>`;
      }).join('')
    : `<div class="schedule-empty">이 날 등록된 일정이 없습니다</div>`;

  wrap.innerHTML = `
    <div class="calendar-wrap" style="--dept-color:${deptVar}">
      <div class="calendar-header">
        <span class="calendar-month">${headerLabel}</span>
        <span class="calendar-dept-label mono">${isAll ? '전체 부서 통합' : state.dept}</span>
      </div>
      <div class="calendar-dow-row">
        ${['일','월','화','수','목','금','토'].map(d=>`<span class="calendar-dow">${d}</span>`).join('')}
      </div>
      <div class="calendar-grid">${cells}</div>
      <div class="calendar-day-detail">
        <p class="calendar-day-detail-label">${sm}.${sd} 일정</p>
        ${detailRows}
      </div>
    </div>`;

  wrap.querySelectorAll('[data-key]').forEach(btn=>{
    btn.onclick = ()=>{ state.selectedDate = btn.dataset.key; renderScheduleInto(targetId); };
  });
}

function renderBriefing(){
  const wrap = document.getElementById('briefing');
  if(!state.data){ wrap.innerHTML=''; return; }

  const unreported = state.data.unreportedDepartments || [];
  const done = DEPTS.length - unreported.length;
  const pct = Math.round((done / DEPTS.length) * 100);
  const R = 42, C = 2 * Math.PI * R;
  const offset = C * (1 - done / DEPTS.length);
  const ringColor = pct < 50 ? '#FF453A' : '#FF9F0A';

  const chipOf = dept => {
    const missing = unreported.includes(dept);
    return `<span class="dept-chip ${missing?'missing':''}">
      <span class="chip-dot"></span>${dept.slice(0,2)} ${missing ? '대기' : '완료'}
    </span>`;
  };
  const doneChips    = DEPTS.filter(d=>!unreported.includes(d)).map(chipOf).join('');
  const missingChips = DEPTS.filter(d=>unreported.includes(d)).map(chipOf).join('');
  const chips = [
    doneChips    ? `<div class="dept-chips-row">${doneChips}</div>`    : '',
    missingChips ? `<div class="dept-chips-row">${missingChips}</div>` : ''
  ].join('');
